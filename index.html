const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let noiseBuffer = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new AudioCtx();
    const len = audioCtx.sampleRate * 3.5;
    noiseBuffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = noiseBuffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type, volScale = 1) {
  initAudio();
  if (!audioCtx || volScale <= 0.01) return;
  const master = settings.masterVol * volScale;
  if (master <= 0.005) return;
  const now = audioCtx.currentTime;

  function burst(dur, filterType, fStart, fEnd, vol, delay = 0, q = 1.3) {
    const src = audioCtx.createBufferSource();
    src.buffer = noiseBuffer;
    const f = audioCtx.createBiquadFilter();
    f.type = filterType;
    f.Q.setValueAtTime(q, now + delay);
    f.frequency.setValueAtTime(Math.max(24, fStart), now + delay);
    if (fEnd) f.frequency.exponentialRampToValueAtTime(Math.max(24, fEnd), now + delay + dur);
    const g = audioCtx.createGain();
    g.gain.setValueAtTime(Math.min(1, vol * master), now + delay);
    g.gain.exponentialRampToValueAtTime(0.0006, now + delay + dur);
    src.connect(f); f.connect(g); g.connect(audioCtx.destination);
    src.start(now + delay); src.stop(now + delay + dur);
  }

  function osc(wave, fStart, fEnd, dur, vol, delay = 0) {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = wave;
    o.frequency.setValueAtTime(Math.max(24, fStart), now + delay);
    if (fEnd) o.frequency.exponentialRampToValueAtTime(Math.max(24, fEnd), now + delay + dur);
    g.gain.setValueAtTime(Math.min(1, vol * master), now + delay);
    g.gain.exponentialRampToValueAtTime(0.0006, now + delay + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(now + delay); o.stop(now + delay + dur);
  }

  if (type === 'ui_hover') {
    osc('triangle', 920, 1180, 0.018, 0.14);
    burst(0.014, 'highpass', 3200, 1800, 0.08, 0, 2.2);
  } else if (type === 'ui_click') {
    osc('square', 1380, 620, 0.032, 0.25);
    osc('sine', 420, 190, 0.038, 0.22);
    burst(0.025, 'bandpass', 2600, 1100, 0.22, 0, 2.0);
  } else if (type === 'ui_toggle') {
    osc('triangle', 1050, 1520, 0.028, 0.22);
    burst(0.02, 'highpass', 2800, 1500, 0.14, 0, 2.2);

function roundRect(c, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}

function createTextures() {
  const tex = {};

  const sand = document.createElement('canvas');
  sand.width = 256; sand.height = 256;
  const sctx = sand.getContext('2d');
  sctx.fillStyle = '#cca268';
  sctx.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 120; i++) {
    const x = Math.random() * 256, y = Math.random() * 256, r = 10 + Math.random() * 36;
    const g = sctx.createRadialGradient(x, y, 1, x, y, r);
    g.addColorStop(0, Math.random() > 0.45 ? 'rgba(248, 224, 178, 0.32)' : 'rgba(92, 60, 26, 0.28)');
    g.addColorStop(1, 'rgba(0,0,0,0)');
    sctx.fillStyle = g;
    sctx.beginPath(); sctx.arc(x, y, r, 0, Math.PI * 2); sctx.fill();
  }
  for (let i = 0; i < 5500; i++) {
    sctx.fillStyle = Math.random() > 0.5 ? 'rgba(38, 22, 8, 0.25)' : 'rgba(255, 245, 212, 0.22)';
    sctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
  }
  tex.sand = ctx.createPattern(sand, 'repeat');

  const cobble = document.createElement('canvas');
  cobble.width = 256; cobble.height = 256;
  const cctx = cobble.getContext('2d');
  cctx.fillStyle = '#7e6a50';
  cctx.fillRect(0, 0, 256, 256);
  const rows = 6, rowH = 256 / rows;
  for (let r = 0; r < rows; r++) {
    const y = r * rowH, offset = (r % 2) * 28;
    let x = -offset;
    while (x < 256) {
      const bw = 38 + ((r * 19 + Math.abs(x) * 7) % 28), bh = rowH - 3;
      const shade = ((r * 13 + Math.abs(x) * 5) % 26) - 13;
      cctx.fillStyle = `rgb(${172 + shade}, ${146 + shade}, ${108 + shade})`;
      cctx.fillRect(x + 1.5, y + 1.5, bw - 3, bh);
      cctx.strokeStyle = 'rgba(28, 20, 12, 0.78)';
      cctx.lineWidth = 1.6;
      cctx.strokeRect(x + 1.5, y + 1.5, bw - 3, bh);
      x += bw;
    }
  }
  tex.cobble = ctx.createPattern(cobble, 'repeat');

  const wallStone = document.createElement('canvas');
  wallStone.width = 256; wallStone.height = 256;
  const wctx = wallStone.getContext('2d');
  wctx.fillStyle = '#735c3e';
  wctx.fillRect(0, 0, 256, 256);
  const wRows = 8, wRowH = 256 / wRows;
  for (let r = 0; r < wRows; r++) {
    const y = r * wRowH, shift = (r % 2) * 32;
    let x = -shift;
    while (x < 256) {
      const bw = 44 + ((r * 23 + Math.abs(x) * 11) % 30), bh = wRowH - 3;
      const delta = ((r * 17 + Math.abs(x) * 3) % 30) - 15;
      wctx.fillStyle = `rgb(${178 + delta}, ${148 + delta}, ${104 + delta})`;
      wctx.fillRect(x + 1.5, y + 1.5, bw - 3, bh);
      wctx.strokeStyle = 'rgba(28, 19, 10, 0.8)';
      wctx.lineWidth = 1.6;
      wctx.strokeRect(x + 1.5, y + 1.5, bw - 3, bh);
      x += bw;
    }
  }
  tex.wallStone = ctx.createPattern(wallStone, 'repeat');

  const crate = document.createElement('canvas');
  crate.width = 84; crate.height = 84;
  const crctx = crate.getContext('2d');
  crctx.fillStyle = '#965e26';
  crctx.fillRect(0, 0, 84, 84);
  crctx.strokeStyle = 'rgba(30, 15, 4, 0.9)';
  crctx.lineWidth = 3.2;
  crctx.beginPath();
  crctx.moveTo(10, 10); crctx.lineTo(74, 74);
  crctx.moveTo(74, 10); crctx.lineTo(10, 74);
  crctx.stroke();
  crctx.strokeRect(9, 9, 66, 66);
  tex.crate = crate;

  const vgui = document.createElement('canvas');
  vgui.width = 320; vgui.height = 320;
  const gctx = vgui.getContext('2d');
  gctx.fillStyle = '#4a4e3d';
  gctx.fillRect(0, 0, 320, 320);
  for (let i = 0; i < 4000; i++) {
    gctx.fillStyle = i % 2 === 0 ? 'rgba(255, 255, 230, 0.04)' : 'rgba(0, 0, 0, 0.14)';
    gctx.fillRect(Math.random() * 320, Math.random() * 320, 2, 2);
  }
  tex.vguiBg = ctx.createPattern(vgui, 'repeat');

  return tex;
}

function drawWeaponSilhouette(g, key) {
  if (key === 'knife') {
    g.fillStyle = '#24201c';
    roundRect(g, 0, 3.0, 11, 4.0, 1.4); g.fill();
    g.fillStyle = '#e0b428';
    g.fillRect(11.0, 1.6, 2.4, 6.8);
    g.fillStyle = '#eef4fa';
    g.beginPath();
    g.moveTo(13.4, 2.5);
    g.quadraticCurveTo(26, 2.2, 35, 5.2);
    g.lineTo(13.4, 6.6);
    g.closePath();
    g.fill();
  } else if (key === 'ak47' || key === 'galil') {
    const wood = key === 'ak47' ? '#964b1b' : '#4a4e54';
    const woodLight = key === 'ak47' ? '#b86228' : '#636870';
    g.fillStyle = wood;
    roundRect(g, -2, 2.8, 11, 4.8, 1.6); g.fill();
    g.fillStyle = '#26292e';
    roundRect(g, 9, 2.2, 14, 6.0, 1.5); g.fill();
    g.fillStyle = key === 'ak47' ? '#a8521c' : '#31353b';
    g.fillRect(14, 7.6, 4.5, 6.2);
    g.fillStyle = woodLight;
    roundRect(g, 23, 2.8, 9.5, 4.8, 1.4); g.fill();
    g.fillStyle = '#1b1d21';
    g.fillRect(32.5, 4.0, 9.5, 2.4);
  } else if (key === 'm4a4' || key === 'm4a1s' || key === 'famas' || key === 'aug' || key === 'sg553') {
    g.fillStyle = '#23272c';
    roundRect(g, -2, 3.0, 11, 4.6, 1.4); g.fill();
    g.fillStyle = '#3c424b';
    roundRect(g, 9, 2.3, 14, 5.8, 1.4); g.fill();
    g.fillStyle = '#1c1f24';
    g.fillRect(15, 7.8, 4.2, 5.5);
    g.fillStyle = '#323740';
    roundRect(g, 23, 2.8, 10, 4.8, 1.3); g.fill();
    if (key === 'm4a1s') {
      g.fillStyle = '#191b1f';
      roundRect(g, 33, 3.5, 13, 3.6, 1.4); g.fill();
    } else {
      g.fillStyle = '#181a1e';
      g.fillRect(33, 4.1, 8.5, 2.3);
    }
  } else if (key === 'awp' || key === 'ssg08') {
    const stockCol = key === 'awp' ? '#4d6b43' : '#3a414a';
    g.fillStyle = stockCol;
    roundRect(g, -2, 2.6, 32, 6.0, 2.0); g.fill();
    g.fillStyle = '#1e2228';
    roundRect(g, 11, 0.4, 15, 3.0, 1.2); g.fill();
    g.fillStyle = '#1b1d21';
    g.fillRect(30, 4.0, 19, 2.8);
  } else if (['mac10','mp9','mp7','mp5sd','ump45','p90','ppbizon'].includes(key)) {
    g.fillStyle = '#292d33';
    roundRect(g, 3, 2.6, 18, 5.6, 1.6); g.fill();
    g.fillStyle = '#4b525c';
    roundRect(g, 20, 3.0, 10, 4.8, 1.5); g.fill();
    g.fillStyle = '#191b1f';
    g.fillRect(15, 7.8, 3.5, 5.0);
    if (key === 'mp5sd') {
      g.fillStyle = '#181a1d';
      roundRect(g, 30, 3.4, 9.5, 3.8, 1.4); g.fill();
    }
  } else if (['nova','xm1014','mag7','sawedoff','negev','m249'].includes(key)) {
    const isShotgun = ['nova','xm1014','mag7','sawedoff'].includes(key);
    g.fillStyle = isShotgun ? '#5e391b' : '#2a2e36';
    roundRect(g, -1, 2.8, 12, 5.0, 1.5); g.fill();
    g.fillStyle = '#23262c';
    roundRect(g, 11, 2.4, 24, 5.4, 1.5); g.fill();
    if (!isShotgun) {
      g.fillStyle = '#3b4a2e';
      roundRect(g, 14, 7.5, 7, 5.5, 1.2); g.fill();
    }
  } else {
    const chrome = (key === 'deagle' || key === 'r8') ? '#dce3eb' : '#484f59';
    g.fillStyle = '#25211e';
    g.fillRect(8, 7.2, 5.5, 5.2);
    g.fillStyle = chrome;
    roundRect(g, 8, 2.3, 19, 6.2, 1.6); g.fill();
    if (key === 'usp') {
      g.fillStyle = '#181a1e';
      roundRect(g, 27, 2.7, 10, 4.8, 1.6); g.fill();
    }
  }
}

  const clean = nameInput.value.replace(/[^a-zA-Z0-9_\- ]/g, '').trim();
  playerNickname = (clean || 'PLAYER').toUpperCase();

  if (p) p.name = playerNickname;

function positionNameInput() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  if (gameState === 'TEAM_SELECT' || gameState === 'CLASS_SELECT') {
    nameInput.style.left = (cx - 280) + 'px';
    nameInput.style.top = (cy - 108) + 'px';
    nameInput.style.width = '280px';
    nameInput.style.display = 'block';
  } else if (gameState === 'OPTIONS' && activeOptionsTab === 'Multiplayer') {
    const px = cx - 320, py = cy - 220;
    nameInput.style.left = (px + 170) + 'px';
    nameInput.style.top = (py + 96) + 'px';
    nameInput.style.width = '230px';
    nameInput.style.display = 'block';
  } else {
    nameInput.style.display = 'none';
  }
}

nameInput.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    e.preventDefault();
    nameInput.blur();
  }
});

resize();

window.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (document.activeElement === nameInput) {
    if (k === 'escape') nameInput.blur();
    return;
  }
  keys[k] = true;

  if (gameState === 'MAIN_MENU') {
    if (k === '1') { playSound('ui_click'); gameState = 'CREATE_SERVER'; }
    if (k === '2') { playSound('ui_click'); openOptionsWindow(); }
    return;
  }

  if (gameState === 'CREATE_SERVER') {
    if (k === 'escape') { playSound('ui_click'); gameState = 'MAIN_MENU'; }
    return;
  }

  if (gameState === 'OPTIONS') {
    if (k === 'escape') { playSound('ui_click'); gameState = 'MAIN_MENU'; }
    return;
  }

  if (gameState === 'TEAM_SELECT') {
    if (k === '1') { pendingTeam = 'T'; gameState = 'CLASS_SELECT'; playSound('ui_click'); }
    if (k === '2') { pendingTeam = 'CT'; gameState = 'CLASS_SELECT'; playSound('ui_click'); }
    if (k === 'escape' || k === '0') { gameState = 'CREATE_SERVER'; playSound('ui_click'); }
    return;
  }

  if (gameState === 'CLASS_SELECT') {
    const list = pendingTeam === 'T' ? T_CLASSES : CT_CLASSES;
    const picked = list.find(c => c.key === k);
    if (picked) { playSound('ui_click'); startGame(pendingTeam, picked.name); }
    if (k === 'escape' || k === '0') { gameState = 'TEAM_SELECT'; playSound('ui_click'); }
    return;
  }

  if (k === 'b' && (gameState === 'FREEZE_TIME' || gameState === 'PLAYING')) {
    const p = getPlayer();
    if (p && p.alive && (settings.gameMode === 'DEATHMATCH' || isInBuyZone(p))) {
      buyMenuOpen = !buyMenuOpen;
      buyCategoryIndex = null;
      playSound('ui_click');
    }
  }
  if (k === 'escape') {
    if (buyCategoryIndex !== null) { buyCategoryIndex = null; playSound('ui_click'); }
    else if (buyMenuOpen) { buyMenuOpen = false; playSound('ui_click'); }
    else if (gameState === 'PLAYING' || gameState === 'FREEZE_TIME') {
      gameState = 'MAIN_MENU';
      playSound('ui_click');
    }
  }

  const p = getPlayer();
  if (p && p.alive) {
    if (buyMenuOpen) {
      handleBuyMenuKey(p, k);
    } else {
      if (k === '1' && p.inventory[1]) switchWeapon(p, 1);
      if (k === '2' && p.inventory[2]) switchWeapon(p, 2);
      if (k === '3') switchWeapon(p, 3);
      if (k === '4' && p.inventory[4]) switchWeapon(p, 4);
      if (k === '5' && p.inventory[5]) switchWeapon(p, 5);
      if (k === 'q') switchWeapon(p, p.lastSlot || 2);
      if (k === 'r') startReload(p);
      if (k === 'g') dropCurrentWeapon(p);
    }
  }
});

window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function handleBuyMenuKey(p, k) {
  if (k === '0') {
    if (buyCategoryIndex !== null) { buyCategoryIndex = null; playSound('ui_click'); }
    else { buyMenuOpen = false; playSound('ui_click'); }
    return;
  }
  if (buyCategoryIndex === null) {
    const catIdx = BUY_CATEGORIES.findIndex(c => c.key === k);
    if (catIdx !== -1) { buyCategoryIndex = catIdx; playSound('ui_click'); }
  } else {
    const cat = BUY_CATEGORIES[buyCategoryIndex];
    const item = cat.items.find(it => it.key === k);
    if (item) buyItem(p, item.id, false);
  }
}

function updateSliderFromMouse(px) {
  if (!draggingSlider) return;
  if (draggingSlider === 'sensitivity') {
    const trackX = px + 36, trackW = 240;
    const ratio = Math.max(0, Math.min(1, (mouse.x - trackX) / trackW));
    draftSettings.mouseSensitivity = +(0.2 + ratio * 19.8).toFixed(1);
  } else if (draggingSlider === 'volume') {
    const trackX = px + 36, trackW = 240;
    const ratio = Math.max(0, Math.min(1, (mouse.x - trackX) / trackW));
    draftSettings.masterVol = +ratio.toFixed(2);
  }
}

window.addEventListener('mousemove', e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  if (gameState === 'OPTIONS' && draggingSlider) {
    const cx = canvas.width / 2, cy = canvas.height / 2;
    updateSliderFromMouse(cx - 320);
  }
  const hitKey = getHoveredInteractiveKey();
  if (hitKey && hitKey !== hoveredMenuKey) {
    playSound('ui_hover', 0.75);
  }
  hoveredMenuKey = hitKey;
});

window.addEventListener('mousedown', e => {
  if (e.button === 0) {
    if (e.target !== nameInput && document.activeElement === nameInput) {
      nameInput.blur();
    }
    initAudio();
    mouse.down = true;
    mouse.clicked = true;
    handleCanvasClick();
  }
});
window.addEventListener('mouseup', e => {
  if (e.button === 0) {
    mouse.down = false;
    draggingSlider = null;
  }
});

function inRect(x, y, rx, ry, rw, rh) {
  return x >= rx && x <= rx + rw && y >= ry && y <= ry + rh;
}

function getHoveredInteractiveKey() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  if (gameState === 'MAIN_MENU') {
    const startY = canvas.height * 0.50;
    if (inRect(mouse.x, mouse.y, 44, startY, 240, 34)) return 'mm_create';
    if (inRect(mouse.x, mouse.y, 44, startY + 42, 240, 34)) return 'mm_options';
    if (inRect(mouse.x, mouse.y, 44, startY + 84, 240, 34)) return 'mm_quit';
    return null;
  }

  if (gameState === 'CREATE_SERVER') {
    const px = cx - 310, py = cy - 205, pw = 620, ph = 410;
    if (inRect(mouse.x, mouse.y, px + pw - 28, py + 8, 20, 20)) return 'cs_close';
    if (inRect(mouse.x, mouse.y, px + 220, py + 86, 42, 28)) return 'cs_bots_dec';
    if (inRect(mouse.x, mouse.y, px + 332, py + 86, 42, 28)) return 'cs_bots_inc';
    if (inRect(mouse.x, mouse.y, px + 220, py + 138, 130, 30)) return 'cs_mode_casual';
    if (inRect(mouse.x, mouse.y, px + 362, py + 138, 135, 30)) return 'cs_mode_dm';
    for (let i = 0; i < DIFFICULTIES.length; i++) {
      const dx = px + 220 + (i % 3) * 124;
      const dy = py + 192 + Math.floor(i / 3) * 36;
      if (inRect(mouse.x, mouse.y, dx, dy, 116, 30)) return 'cs_diff_' + i;
    }
    if (inRect(mouse.x, mouse.y, px + pw - 292, py + ph - 44, 132, 30)) return 'cs_start';
    if (inRect(mouse.x, mouse.y, px + pw - 148, py + ph - 44, 124, 30)) return 'cs_cancel';
    return null;
  }

  if (gameState === 'OPTIONS') {
    const px = cx - 320, py = cy - 220, pw = 640, ph = 440;
    if (inRect(mouse.x, mouse.y, px + pw - 28, py + 8, 20, 20)) return 'opt_close';
    if (inRect(mouse.x, mouse.y, px + 20, py + 42, 110, 26)) return 'opt_tab_mp';
    if (inRect(mouse.x, mouse.y, px + 134, py + 42, 100, 26)) return 'opt_tab_mouse';
    if (inRect(mouse.x, mouse.y, px + 238, py + 42, 100, 26)) return 'opt_tab_audio';

    if (activeOptionsTab === 'Multiplayer') {
      const colors = ['#42f554', '#ffc42e', '#48b8ff', '#ff4848', '#ffffff'];
      for (let i = 0; i < colors.length; i++) {
        if (inRect(mouse.x, mouse.y, px + 170 + i * 38, py + 152, 26, 26)) return 'opt_col_' + i;
      }
      if (inRect(mouse.x, mouse.y, px + 36, py + 206, 20, 20)) return 'opt_dyn_xhair';
      if (inRect(mouse.x, mouse.y, px + 36, py + 242, 20, 20)) return 'opt_hit_sound';
    } else if (activeOptionsTab === 'Mouse') {
      if (inRect(mouse.x, mouse.y, px + 36, py + 102, 20, 20)) return 'opt_mouse_filter';
    } else if (activeOptionsTab === 'Audio') {
      if (inRect(mouse.x, mouse.y, px + 36, py + 190, 20, 20)) return 'opt_audio_hit';
    }

    if (inRect(mouse.x, mouse.y, px + pw - 348, py + ph - 42, 104, 28)) return 'opt_ok';
    if (inRect(mouse.x, mouse.y, px + pw - 236, py + ph - 42, 104, 28)) return 'opt_cancel';
    if (inRect(mouse.x, mouse.y, px + pw - 124, py + ph - 42, 104, 28)) return 'opt_apply';
    return null;
  }

  return null;
}

function handleCanvasClick() {
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  if (gameState === 'MAIN_MENU') {
    const startY = canvas.height * 0.50;
    if (inRect(mouse.x, mouse.y, 44, startY, 240, 34)) {
      playSound('ui_click');
      gameState = 'CREATE_SERVER';
    } else if (inRect(mouse.x, mouse.y, 44, startY + 42, 240, 34)) {
      playSound('ui_click');
      openOptionsWindow();
    } else if (inRect(mouse.x, mouse.y, 44, startY + 84, 240, 34)) {
      playSound('ui_click');
      try { window.close(); } catch (_) {}
      gameState = 'MAIN_MENU';
    }
    return;
  }

  if (gameState === 'CREATE_SERVER') {
    const px = cx - 310, py = cy - 205, pw = 620, ph = 410;
    if (inRect(mouse.x, mouse.y, px + pw - 28, py + 8, 20, 20) ||
        inRect(mouse.x, mouse.y, px + pw - 148, py + ph - 44, 124, 30)) {
      playSound('ui_click');
      gameState = 'MAIN_MENU';
      return;
    }
    if (inRect(mouse.x, mouse.y, px + 220, py + 86, 42, 28)) {
      settings.botCount = Math.max(0, settings.botCount - 2);
      playSound('ui_toggle');
    } else if (inRect(mouse.x, mouse.y, px + 332, py + 86, 42, 28)) {
      settings.botCount = Math.min(18, settings.botCount + 2);
      playSound('ui_toggle');
    } else if (inRect(mouse.x, mouse.y, px + 220, py + 138, 130, 30)) {
      settings.gameMode = 'CASUAL';
      playSound('ui_toggle');
    } else if (inRect(mouse.x, mouse.y, px + 362, py + 138, 135, 30)) {
      settings.gameMode = 'DEATHMATCH';
      playSound('ui_toggle');
    } else {
      for (let i = 0; i < DIFFICULTIES.length; i++) {
        const dx = px + 220 + (i % 3) * 124;
        const dy = py + 192 + Math.floor(i / 3) * 36;
        if (inRect(mouse.x, mouse.y, dx, dy, 116, 30)) {
          settings.difficulty = DIFFICULTIES[i];
          playSound('ui_toggle');
        }
      }
    }
    if (inRect(mouse.x, mouse.y, px + pw - 292, py + ph - 44, 132, 30)) {
      playSound('ui_click');
      gameState = 'TEAM_SELECT';
    }
    return;
  }

  if (gameState === 'OPTIONS') {
    const px = cx - 320, py = cy - 220, pw = 640, ph = 440;

    if (inRect(mouse.x, mouse.y, px + pw - 28, py + 8, 20, 20) ||
        inRect(mouse.x, mouse.y, px + pw - 236, py + ph - 42, 104, 28)) {
      playSound('ui_click');
      gameState = 'MAIN_MENU';
      return;
    }
    if (inRect(mouse.x, mouse.y, px + pw - 124, py + ph - 42, 104, 28)) {
      applyDraftSettings();
      playSound('ui_click');
      return;
    }
    if (inRect(mouse.x, mouse.y, px + pw - 348, py + ph - 42, 104, 28)) {
      applyDraftSettings();
      playSound('ui_click');
      gameState = 'MAIN_MENU';
      return;
    }

    if (inRect(mouse.x, mouse.y, px + 20, py + 42, 110, 26)) {
      activeOptionsTab = 'Multiplayer'; playSound('ui_toggle'); positionNameInput(); return;
    }
    if (inRect(mouse.x, mouse.y, px + 134, py + 42, 100, 26)) {
      activeOptionsTab = 'Mouse'; playSound('ui_toggle'); positionNameInput(); return;
    }
    if (inRect(mouse.x, mouse.y, px + 238, py + 42, 100, 26)) {
      activeOptionsTab = 'Audio'; playSound('ui_toggle'); positionNameInput(); return;
    }

    if (activeOptionsTab === 'Multiplayer') {
      const colors = ['#42f554', '#ffc42e', '#48b8ff', '#ff4848', '#ffffff'];
      colors.forEach((c, i) => {
        if (inRect(mouse.x, mouse.y, px + 170 + i * 38, py + 152, 26, 26)) {
          draftSettings.crosshairColor = c; playSound('ui_toggle');
        }
      });
      if (inRect(mouse.x, mouse.y, px + 36, py + 206, 20, 20)) {
        draftSettings.dynamicCrosshair = !draftSettings.dynamicCrosshair; playSound('ui_toggle');
      }
      if (inRect(mouse.x, mouse.y, px + 36, py + 242, 20, 20)) {
        draftSettings.hitSoundEnabled = !draftSettings.hitSoundEnabled; playSound('ui_toggle');
      }
    } else if (activeOptionsTab === 'Mouse') {
      if (inRect(mouse.x, mouse.y, px + 36, py + 102, 20, 20)) {
        draftSettings.mouseFilter = !draftSettings.mouseFilter; playSound('ui_toggle');
      }
      if (inRect(mouse.x, mouse.y, px + 32, py + 206, 248, 28)) {
        draggingSlider = 'sensitivity';
        updateSliderFromMouse(px);
        playSound('ui_toggle');
      }
    } else if (activeOptionsTab === 'Audio') {
      if (inRect(mouse.x, mouse.y, px + 32, py + 116, 248, 28)) {
        draggingSlider = 'volume';
        updateSliderFromMouse(px);
        playSound('ui_toggle');
      }
      if (inRect(mouse.x, mouse.y, px + 36, py + 190, 20, 20)) {
        draftSettings.hitSoundEnabled = !draftSettings.hitSoundEnabled; playSound('ui_toggle');
      }
    }
    return;
  }

  if (gameState === 'TEAM_SELECT') {
    if (inRect(mouse.x, mouse.y, cx - 280, cy - 45, 260, 113)) {
      pendingTeam = 'T'; gameState = 'CLASS_SELECT'; playSound('ui_click');
    } else if (inRect(mouse.x, mouse.y, cx + 20, cy - 45, 260, 113)) {
      pendingTeam = 'CT'; gameState = 'CLASS_SELECT'; playSound('ui_click');
    }
    return;
  }

  if (gameState === 'CLASS_SELECT') {
    const list = pendingTeam === 'T' ? T_CLASSES : CT_CLASSES;
    for (let i = 0; i < list.length; i++) {
      const y = cy - 52 + i * 46;
      if (inRect(mouse.x, mouse.y, cx - 280, y, 280, 38)) {
        playSound('ui_click');
        startGame(pendingTeam, list[i].name);
        return;
      }
    }
    return;
  }

  if (buyMenuOpen) {
    const p = getPlayer();
    if (!p || !p.alive) return;
    const panelX = cx - 340;
    const panelY = cy - 220;

    if (buyCategoryIndex === null) {
      BUY_CATEGORIES.forEach((cat, idx) => {
        const y = panelY + 56 + idx * 36;
        if (inRect(mouse.x, mouse.y, panelX + 24, y, 266, 30)) {
          buyCategoryIndex = idx;
          playSound('ui_click');
        }
      });
    } else {
      const cat = BUY_CATEGORIES[buyCategoryIndex];
      cat.items.forEach((it, idx) => {
        const y = panelY + 60 + idx * 38;
        if (inRect(mouse.x, mouse.y, panelX + 24, y, 316, 32)) {
          buyItem(p, it.id, false);
        }
      });
      if (inRect(mouse.x, mouse.y, panelX + 24, panelY + 412, 220, 32)) {
        buyCategoryIndex = null;
        playSound('ui_click');
      }
    }
  }
}

function getDiffParams() {
  switch (settings.difficulty) {
    case 'VERY EASY': return { aimLerp: 0.08, accSpread: 0.14, dmgMult: 0.65, reactionMs: 420 };
    case 'EASY':      return { aimLerp: 0.13, accSpread: 0.095, dmgMult: 0.82, reactionMs: 280 };
    case 'MEDIUM':    return { aimLerp: 0.21, accSpread: 0.055, dmgMult: 1.0,  reactionMs: 140 };
    case 'HARD':      return { aimLerp: 0.34, accSpread: 0.028, dmgMult: 1.18, reactionMs: 65 };
    case 'EXTREME':   return { aimLerp: 0.52, accSpread: 0.012, dmgMult: 1.35, reactionMs: 0 };
    default:          return { aimLerp: 0.21, accSpread: 0.055, dmgMult: 1.0,  reactionMs: 140 };
  }
}

function pushRadio(sender, team, msg) {
  radioFeed.unshift({ sender, team, msg, timer: 5.0 });
  if (radioFeed.length > 4) radioFeed.pop();
}

function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function normalizeAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}
function lerpAngle(current, target, t) {
  return current + normalizeAngle(target - current) * t;
}

// --- SMOKE REACTIVITY & FIRE ---
function spawnSmokeCloud(x, y, puffs = 18) {
  for (let k = 0; k < puffs; k++) {
    const ang = (k / puffs) * Math.PI * 2 + (Math.random() - 0.5) * 0.35;
    const spd = k === 0 ? 0 : 28 + Math.random() * 58;
    smokeClouds.push({
      x: x + Math.cos(ang) * 10,
      y: y + Math.sin(ang) * 10,
      vx: Math.cos(ang) * spd,
      vy: Math.sin(ang) * spd - 6,
      targetRadius: 114 + Math.random() * 42,
      radius: 14,
      driftSeed: Math.random() * 100,
      life: 14.5
    });
  }
}

function punchSmokeHole(x, y, radius = 48) {
  for (let sc of smokeClouds) {
    if (dist({ x, y }, sc) < sc.radius + radius * 0.65) {
      smokeClearings.push({ x, y, radius, life: 3.1, maxLife: 3.1 });
      if (smokeClearings.length > 90) smokeClearings.shift();
    }
  }
}

function isClearedByHole(x, y) {
  for (let hole of smokeClearings) {
    if (hole.life > 0.25 && dist({ x, y }, hole) < hole.radius) return true;
  }
  return false;
}

function ignitePalm(pl, ownerMeta) {
  if (pl.burnAmount >= 1.0) return;
  if (!pl.burning) {
    pl.burning = true;
    pl.ownerMeta = ownerMeta;
    const p = getPlayer();
    playSound('fire_ignite', p ? Math.max(0.12, 1 - dist(pl, p) / 1300) : 0.45);
  }
}

function spawnFirePatch(x, y, radius, life, ownerMeta, canSpread = true) {
  if (firePatches.length > 36) return;
  firePatches.push({
    x, y,
    vx: (Math.random() - 0.5) * 24,
    vy: (Math.random() - 0.5) * 24,
    radius,
    life,
    ownerId: ownerMeta.ownerId,
    ownerTeam: ownerMeta.ownerTeam,
    ownerName: ownerMeta.ownerName,
    isPlayer: ownerMeta.isPlayer,
    burnTick: 0,
    spreadTimer: canSpread ? (0.9 + Math.random() * 0.8) : 999,
    spreadsLeft: canSpread ? 2 : 0
  });
}

function disturbTree(pl, impulse, shedCount = 8) {
  pl.angleVel += impulse;
  if (pl.hitCooldown <= 0) {
    pl.hitCooldown = 0.25;
    const p = getPlayer();
    playSound('leaf_rustle', p ? Math.max(0.08, 1 - dist(pl, p) / 1100) : 0.4);
  }
  for (let i = 0; i < shedCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 35 + Math.random() * 110;
    leaves.push({
      x: pl.x + Math.cos(a) * (12 + Math.random() * 24),
      y: pl.y + Math.sin(a) * (12 + Math.random() * 24),
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd + 18,
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 9,
      len: 7 + Math.random() * 6,
      color: pl.burning ? (i % 2 === 0 ? '#783412' : '#c95614') : (i % 2 === 0 ? '#5b9c34' : '#78b846'),
      life: 2.2 + Math.random() * 1.4
    });
  }
}

function createSoldier(id, name, classTitle, team, x, y, isPlayer) {
  const defaultPistol = team === 'T' ? 'glock' : 'usp';
  return {
    id, name, classTitle, team, x, y,
    vx: 0, vy: 0,
    radius: 18,
    angle: team === 'T' ? 0 : Math.PI,
    hp: 100, armor: 0, hasHelmet: false, hasDefuseKit: false,
    alive: true, deathAnim: 0, respawnTimer: 0, isPlayer,
    frags: 0,
    baseSpeed: 238, walkPhase: 0, stepAccum: 0, moving: false,
    swingAnim: 0,
    inventory: {
      1: null,
      2: createWeaponInstance(defaultPistol),
      3: createWeaponInstance('knife'),
      4: null, 5: null
    },
    activeSlot: 2, lastSlot: 3, lastShot: 0, recoilOffset: 0,
    reloading: false, reloadEnd: 0, muzzleFlash: 0,
    aiMoveDir: { x: 0, y: 0 }, aiTimer: 0,
    aiNadeCooldown: 2.5 + Math.random() * 4.5,
    aiPlan: Math.random() < 0.5 ? 'A' : 'B',
    aiStrafeDir: Math.random() < 0.5 ? 1 : -1,
    aiRole: 'ASSAULT',
    lastCalloutTime: 0,
    spotTimer: 0
  };
}

function createWeaponInstance(key) {
  const base = WEAPONS[key];
  return { key, ...base, ammo: base.magSize, reserve: base.reserve };
}

function getPlayer() { return entities.find(e => e.isPlayer); }

function isHostile(a, b) {
  if (!a || !b || a.id === b.id) return false;
  if (settings.gameMode === 'DEATHMATCH') return true;
  return a.team !== b.team;
}

function isInBuyZone(p) {
  if (settings.gameMode === 'DEATHMATCH') return true;
  if (p.team === 'T') return dist(p, { x: 860, y: 2000 }) < 340;
  return dist(p, { x: 1820, y: 520 }) < 340;
}

function getSiteAt(x, y) {
  for (let s of bombSites) {
    if (x >= s.x && x <= s.x + s.w && y >= s.y && y <= s.y + s.h) return s.id;
  }
  return null;
}

function isPointInSmoke(x, y) {
  if (isClearedByHole(x, y)) return false;
  for (let sc of smokeClouds) {
    if (dist({ x, y }, sc) < sc.radius * 0.85) return true;
  }
  return false;
}

function startGame(team, className) {
  const clean = nameInput.value.replace(/[^a-zA-Z0-9_\- ]/g, '').trim();
  playerNickname = (clean || 'PLAYER').toUpperCase();
  playerTeam = team;
  playerClassName = className;
  playerFrags = 0;
  playerMoney = settings.gameMode === 'DEATHMATCH' ? 16000 : 800;
  roundNumber = 1;
  tScore = 0; ctScore = 0;
  tLossStreak = 0; ctLossStreak = 0;
  setupRound();
  positionNameInput();
}

function getSpawnPoint(team, idx) {
  const tSpawns = [
    { x: 820, y: 1980 }, { x: 880, y: 1980 }, { x: 940, y: 1980 }, { x: 820, y: 2050 }, { x: 880, y: 2050 },
    { x: 640, y: 1320 }, { x: 1220, y: 1980 }, { x: 1540, y: 1300 }, { x: 2320, y: 1280 }, { x: 950, y: 1560 }
  ];
  const ctSpawns = [
    { x: 1760, y: 490 }, { x: 1840, y: 490 }, { x: 1920, y: 490 }, { x: 1760, y: 550 }, { x: 1840, y: 550 },
    { x: 2150, y: 860 }, { x: 1560, y: 980 }, { x: 2320, y: 540 }, { x: 1080, y: 1680 }, { x: 1560, y: 1760 }
  ];
  const pool = team === 'T' ? tSpawns : ctSpawns;
  const pt = pool[idx % pool.length];
  return {
    x: pt.x + (Math.random() - 0.5) * 44,
    y: pt.y + (Math.random() - 0.5) * 44
  };
}

function setupRound() {
  gameState = settings.gameMode === 'DEATHMATCH' ? 'PLAYING' : 'FREEZE_TIME';
  phaseTimer = settings.gameMode === 'DEATHMATCH' ? 300.0 : 4.0;
  buyMenuOpen = false;
  buyCategoryIndex = null;
  bullets = []; grenades = []; explosions = []; smokeClouds = [];
  smokeClearings = [];
  firePatches = []; casings = []; particles = []; goreChunks = [];
  leaves = []; bloodDecals = []; bulletHoles = [];
  palms = createPalms();

  const oldPlayer = getPlayer();
  const savedInv = oldPlayer && oldPlayer.alive ? oldPlayer.inventory : null;
  const savedArmor = oldPlayer && oldPlayer.alive ? oldPlayer.armor : 0;
  const savedHelmet = oldPlayer && oldPlayer.alive ? oldPlayer.hasHelmet : false;
  const savedKit = oldPlayer && oldPlayer.alive ? oldPlayer.hasDefuseKit : false;

  entities = [];

  const totalBots = Math.max(0, Math.min(18, settings.botCount));
  const playerIsT = playerTeam === 'T';
  const botTCount = Math.ceil(totalBots / 2);
  const botCTCount = totalBots - botTCount;

  const tNames = ['CARNAGE', 'VIPER', 'KRAKEN', 'GHOST', 'COBRA', 'REAPER', 'FALCON', 'JACKAL', 'WOLVERINE', 'STRIKER'];
  const ctNames = ['SAS-01', 'GIGN-2', 'GSG-9', 'SEAL-6', 'IDF-04', 'SWAT-9', 'DELTA-3', 'K9-UNIT', 'VANGUARD', 'SENTINEL'];
  const teamPlan = Math.random() < 0.5 ? 'A' : 'B';
  const nadePool = ['he', 'flash', 'smoke', 'molotov'];
  const tRifles = ['ak47', 'galil', 'sg553', 'awp', 'mac10'];
  const ctRifles = ['m4a4', 'm4a1s', 'famas', 'aug', 'awp', 'mp9'];

  if (playerIsT) {
    const sp = getSpawnPoint('T', 0);
    const pEnt = createSoldier('T_PL', playerNickname, playerClassName, 'T', sp.x, sp.y, true);
    pEnt.aiPlan = teamPlan;
    entities.push(pEnt);
  }
  for (let i = 0; i < botTCount; i++) {
    const sp = getSpawnPoint(settings.gameMode === 'DEATHMATCH' && i % 2 === 1 ? 'CT' : 'T', i + 1);
    const ffaTeam = settings.gameMode === 'DEATHMATCH' ? ('FFA_' + i) : 'T';
    const visualStyle = T_CLASSES[i % T_CLASSES.length].name;
    const s = createSoldier('T' + i, tNames[i % tNames.length], visualStyle, ffaTeam, sp.x, sp.y, false);
    s.aiPlan = teamPlan;
    s.aiRole = i === 0 ? 'ENTRY' : (i % 3 === 0 ? 'FLANK' : 'ASSAULT');
    s.inventory[5] = createWeaponInstance(nadePool[(roundNumber + i) % nadePool.length]);
    if (settings.gameMode === 'DEATHMATCH' || roundNumber > 1) {
      s.inventory[1] = createWeaponInstance(tRifles[Math.floor(Math.random() * tRifles.length)]);
      s.activeSlot = 1; s.armor = 100; s.hasHelmet = true;
    }
    entities.push(s);
  }

  if (!playerIsT) {
    const sp = getSpawnPoint('CT', 0);
    const pEnt = createSoldier('CT_PL', playerNickname, playerClassName, 'CT', sp.x, sp.y, true);
    pEnt.aiPlan = 'A';
    entities.push(pEnt);
  }
  for (let i = 0; i < botCTCount; i++) {
    const sp = getSpawnPoint(settings.gameMode === 'DEATHMATCH' && i % 2 === 0 ? 'T' : 'CT', i + 1);
    const ffaTeam = settings.gameMode === 'DEATHMATCH' ? ('FFA_CT_' + i) : 'CT';
    const visualStyle = CT_CLASSES[i % CT_CLASSES.length].name;
    const s = createSoldier('CT' + i, ctNames[i % ctNames.length], visualStyle, ffaTeam, sp.x, sp.y, false);
    s.aiPlan = i % 2 === 0 ? 'A' : 'B';
    s.aiRole = i === 0 ? 'ANCHOR_A' : (i === 1 ? 'ANCHOR_B' : 'ROTATE');
    s.inventory[5] = createWeaponInstance(nadePool[(roundNumber + i + 1) % nadePool.length]);
    if (settings.gameMode === 'DEATHMATCH' || roundNumber > 1) {
      s.inventory[1] = createWeaponInstance(ctRifles[Math.floor(Math.random() * ctRifles.length)]);
      s.activeSlot = 1; s.armor = 100; s.hasHelmet = true; s.hasDefuseKit = i % 2 === 0;
    }
    entities.push(s);
  }

  const tPlayers = entities.filter(e => e.team === 'T');
  if (settings.gameMode === 'CASUAL' && tPlayers.length > 0) {
    const carrier = playerIsT ? tPlayers[0] : tPlayers[Math.floor(Math.random() * tPlayers.length)];
    carrier.inventory[4] = createWeaponInstance('c4');
    bomb = {
      state: 'CARRIED', carrierId: carrier.id, x: carrier.x, y: carrier.y, site: null,
      plantProgress: 0, defuseProgress: 0, fuseTimer: 40.0, beepAccum: 0,
      plantSoundAccum: 0, defuseSoundAccum: 0
    };
  } else {
    bomb = { state: 'NONE', carrierId: null, x: 0, y: 0, site: null, plantProgress: 0, defuseProgress: 0, fuseTimer: 40.0, beepAccum: 0, plantSoundAccum: 0, defuseSoundAccum: 0 };
  }

  const p = getPlayer();
  if (p && savedInv) {
    p.inventory[1] = savedInv[1]; p.inventory[2] = savedInv[2];
    p.armor = savedArmor; p.hasHelmet = savedHelmet; p.hasDefuseKit = savedKit;
    p.activeSlot = p.inventory[1] ? 1 : 2;
    Object.values(p.inventory).forEach(w => {
      if (w && w.magSize > 0 && w.kind === 'gun') { w.ammo = w.magSize; w.reserve = WEAPONS[w.key].reserve; }
    });
  }
}

function respawnEntity(ent, idx) {
  const sp = getSpawnPoint(idx % 2 === 0 ? 'T' : 'CT', idx);
  ent.x = sp.x;
  ent.y = sp.y;
  ent.vx = 0;
  ent.vy = 0;
  ent.hp = 100;
  ent.armor = 100;
  ent.alive = true;
  ent.deathAnim = 0;
  ent.respawnTimer = 0;
  ent.reloading = false;
  Object.values(ent.inventory).forEach(w => {
    if (w && w.magSize > 0 && w.kind === 'gun') {
      w.ammo = w.magSize;
      w.reserve = WEAPONS[w.key].reserve;
    }
  });
}

function buyItem(p, itemId, silentFail = false) {
  if (!isInBuyZone(p)) return false;

  if (itemId === 'ammo_prim') {
    const pw = p.inventory[1];
    if (pw && pw.kind === 'gun' && playerMoney >= 120) {
      playerMoney -= 120;
      pw.reserve += pw.magSize;
      playSound('buy');
      return true;
    }
    return false;
  }

  if (itemId === 'ammo_sec') {
    const sw = p.inventory[2];
    if (sw && sw.kind === 'gun' && playerMoney >= 80) {
      playerMoney -= 80;
      sw.reserve += sw.magSize;
      playSound('buy');
      return true;
    }
    return false;
  }

  if (itemId === 'armor') {
    if (playerMoney >= 1000 && (!p.hasHelmet || p.armor < 100)) {
      playerMoney -= 1000; p.armor = 100; p.hasHelmet = true;
      playSound('buy');
      return true;
    }
    return false;
  } else if (itemId === 'kit') {
    if (p.team === 'CT' && playerMoney >= 400 && !p.hasDefuseKit) {
      playerMoney -= 400; p.hasDefuseKit = true;
      playSound('buy');
      return true;
    }
    return false;
  } else if (WEAPONS[itemId]) {
    const wDef = WEAPONS[itemId];
    if (playerMoney >= wDef.price) {
      playerMoney -= wDef.price;
      p.inventory[wDef.slot] = createWeaponInstance(itemId);
      p.activeSlot = wDef.slot;
      playSound('buy');
      return true;
    }
    if (!silentFail) return false;
  }
  return false;
}

function switchWeapon(p, slot) {
  if (p.activeSlot === slot || !p.inventory[slot]) return;
  p.lastSlot = p.activeSlot; p.activeSlot = slot; p.reloading = false;
  playSound('ui_toggle', 0.65);
}

function dropCurrentWeapon(p) {
  if (p.activeSlot === 4 && bomb.state === 'CARRIED' && bomb.carrierId === p.id) {
    p.inventory[4] = null; p.activeSlot = p.inventory[1] ? 1 : 2;
    bomb.state = 'DROPPED'; bomb.carrierId = null;
    bomb.x = p.x + Math.cos(p.angle) * 28; bomb.y = p.y + Math.sin(p.angle) * 28;
  }
}

function startReload(p) {
  const w = p.inventory[p.activeSlot];
  if (!w || w.kind !== 'gun' || w.magSize === 0 || p.reloading) return;
  if (w.ammo === w.magSize || w.reserve <= 0) return;
  p.reloading = true; p.reloadEnd = performance.now() + 1350; playSound('reload');
}

function circleRectCollide(cx, cy, cr, rect) {
  const closestX = Math.max(rect.x, Math.min(cx, rect.x + rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y + rect.h));
  const dx = cx - closestX; const dy = cy - closestY;
  return (dx * dx + dy * dy) < (cr * cr);
}

function lineIntersectsRect(x1, y1, x2, y2, r) {
  return lineLine(x1, y1, x2, y2, r.x, r.y, r.x + r.w, r.y) ||
         lineLine(x1, y1, x2, y2, r.x + r.w, r.y, r.x + r.w, r.y + r.h) ||
         lineLine(x1, y1, x2, y2, r.x + r.w, r.y + r.h, r.x, r.y + r.h) ||
         lineLine(x1, y1, x2, y2, r.x, r.y + r.h, r.x, r.y);
}

function lineLine(x1, y1, x2, y2, x3, y3, x4, y4) {
  const denom = (y4 - y3) * (x2 - x1) - (x4 - x3) * (y2 - y1);
  if (denom === 0) return false;
  const ua = ((x4 - x3) * (y1 - y3) - (y4 - y3) * (x1 - x3)) / denom;
  const ub = ((x2 - x1) * (y1 - y3) - (y2 - y1) * (x1 - x3)) / denom;
  return ua >= 0 && ua <= 1 && ub >= 0 && ub <= 1;
}

function hasLineOfSight(x1, y1, x2, y2) {
  for (let i = 0; i < walls.length; i++) {
    if (lineIntersectsRect(x1, y1, x2, y2, walls[i])) return false;
  }
  for (let i = 0; i < smokeClouds.length; i++) {
    const sc = smokeClouds[i];
    const midX = (x1 + x2) / 2, midY = (y1 + y2) / 2;
    if (dist({ x: midX, y: midY }, sc) < sc.radius * 0.92 && !isClearedByHole(midX, midY)) return false;
  }
  return true;
}

function throwGrenade(thrower, nadeInst) {
  const spd = 710;
  thrower.swingAnim = 1.0;
  grenades.push({
    nadeType: nadeInst.nadeType,
    x: thrower.x + Math.cos(thrower.angle) * 24,
    y: thrower.y + Math.sin(thrower.angle) * 24,
    vx: Math.cos(thrower.angle) * spd + thrower.vx * 0.35,
    vy: Math.sin(thrower.angle) * spd + thrower.vy * 0.35,
    rot: Math.random() * Math.PI * 2, vrot: (Math.random() - 0.5) * 14,
    fuse: nadeInst.nadeType === 'molotov' ? 1.3 : 1.55,
    ownerId: thrower.id, ownerTeam: thrower.team, ownerName: thrower.name, isPlayer: thrower.isPlayer
  });
  thrower.inventory[5] = null;
  thrower.activeSlot = thrower.inventory[1] ? 1 : 2;
}

function detonateGrenade(g) {
  const p = getPlayer();
  const attScale = p ? Math.max(0.05, 1 - dist(g, p) / 1600) : 0.6;
  const attacker = entities.find(e => e.id === g.ownerId) || { id: g.ownerId, name: g.ownerName, team: g.ownerTeam, isPlayer: g.isPlayer, inventory: {} };
  const ownerMeta = { ownerId: g.ownerId, ownerTeam: g.ownerTeam, ownerName: g.ownerName, isPlayer: g.isPlayer };

  palms.forEach(pl => {
    const d = dist(g, pl);
    if (d < 360) disturbTree(pl, (Math.random() > 0.5 ? 1 : -1) * (1 - d / 360) * 14, 14);
  });

  if (g.nadeType === 'he') {
    playSound('he_explode', attScale);
    screenShake = Math.max(screenShake, 24 * attScale);
    explosions.push({ x: g.x, y: g.y, maxRadius: 295, radius: 16, life: 1.0, isC4: false });
    spawnScorch(g.x, g.y, 56, 0.68);
    punchSmokeHole(g.x, g.y, 125);

    for (let i = 0; i < 48; i++) {
      const a = Math.random() * Math.PI * 2;
      const spd = 120 + Math.random() * 480;
      particles.push({
        x: g.x, y: g.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
        color: i % 2 === 0 ? '#ffa226' : '#ff4212', size: 3 + Math.random() * 4,
        life: 0.35 + Math.random() * 0.3, stain: false
      });
    }

    entities.forEach(t => {
      if (!t.alive || !isHostile(attacker, t)) return;
      const d = dist(g, t);
      if (d < 295 && hasLineOfSight(g.x, g.y, t.x, t.y)) {
        damageEntity(attacker, t, Math.round(108 * (1 - d / 295)), Math.atan2(t.y - g.y, t.x - g.x), false, 'HE GRENADE');
      }
    });
  } else if (g.nadeType === 'flash') {
    playSound('flash_pop', attScale);
    explosions.push({ x: g.x, y: g.y, maxRadius: 195, radius: 12, life: 0.55, isC4: false });
    if (p && p.alive) {
      const d = dist(g, p);
      if (d < 470 && hasLineOfSight(g.x, g.y, p.x, p.y)) {
        const angToFlash = Math.atan2(g.y - p.y, g.x - p.x);
        const lookingAt = Math.abs(normalizeAngle(angToFlash - p.angle)) < 1.35;
        flashAlpha = Math.min(1, (1 - d / 470) * 1.15 * (lookingAt ? 1.0 : 0.45));
      }
    }
  } else if (g.nadeType === 'smoke') {
    playSound('smoke_pop', attScale);
    spawnSmokeCloud(g.x, g.y, 18);
  } else if (g.nadeType === 'molotov') {
    playSound('molotov_pop', attScale);
    spawnScorch(g.x, g.y, 70, 0.5);
    for (let f = 0; f < 9; f++) {
      const ang = (f / 9) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
      const spreadDist = f === 0 ? 0 : 28 + Math.random() * 58;
      spawnFirePatch(
        g.x + Math.cos(ang) * spreadDist,
        g.y + Math.sin(ang) * spreadDist,
        36 + Math.random() * 12,
        6.2,
        ownerMeta,
        f < 4
      );
    }
    palms.forEach(pl => {
      if (dist(g, pl) < pl.r + 75) ignitePalm(pl, ownerMeta);
    });
  }
}

function triggerC4Explosion() {
  bomb.state = 'EXPLODED';
  const p = getPlayer();
  const attScale = p ? Math.max(0.25, 1 - dist(bomb, p) / 2200) : 0.9;
  playSound('c4_explode', attScale);
  screenShake = 46;
  explosions.push({ x: bomb.x, y: bomb.y, maxRadius: 740, radius: 24, life: 1.0, isC4: true });
  spawnScorch(bomb.x, bomb.y, 165, 0.92);
  punchSmokeHole(bomb.x, bomb.y, 200);

  palms.forEach(pl => {
    const d = dist(bomb, pl);
    if (d < 850) disturbTree(pl, (Math.random() > 0.5 ? 1 : -1) * (1 - d / 850) * 18, 22);
    if (d < 220) ignitePalm(pl, { ownerId: null, ownerTeam: 'T', ownerName: 'C4', isPlayer: playerTeam === 'T' });
  });

  for (let i = 0; i < 110; i++) {
    const a = Math.random() * Math.PI * 2;
    const spd = 140 + Math.random() * 780;
    particles.push({
      x: bomb.x, y: bomb.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      color: i % 3 === 0 ? '#fff099' : (i % 2 === 0 ? '#ff7b1c' : '#d92614'),
      size: 4 + Math.random() * 6, life: 0.45 + Math.random() * 0.55, stain: false
    });
  }

  entities.forEach(e => {
    if (!e.alive) return;
    const d = dist(e, bomb);
    if (d < 740) {
      e.hp -= Math.round(280 * Math.max(0.15, 1 - d / 740));
      if (e.hp <= 0) {
        e.hp = 0; e.alive = false;
        spawnGoreBurst(e.x, e.y, Math.atan2(e.y - bomb.y, e.x - bomb.x), true);
      }
    }
  });

  if (settings.gameMode === 'CASUAL') {
    endRound('T', 'TARGET HAS BEEN BOMBED', 3500, 1400);
  }
}

function spawnScorch(x, y, radius, alpha) {
  bulletHoles.push({ x, y, r: radius, alpha, scorch: true });
  if (bulletHoles.length > 360) bulletHoles.shift();
}

function spawnGoreBurst(x, y, angle, heavy = false) {
  const count = heavy ? 52 : 28;
  for (let i = 0; i < count; i++) {
    const a = angle + (Math.random() - 0.5) * 1.65;
    const spd = 95 + Math.random() * (heavy ? 450 : 290);
    const isBone = i % 7 === 0;
    goreChunks.push({
      x, y,
      vx: Math.cos(a) * spd,
      vy: Math.sin(a) * spd,
      r: isBone ? 3.4 : (3.6 + Math.random() * (heavy ? 6.8 : 4.5)),
      rot: Math.random() * Math.PI * 2,
      vrot: (Math.random() - 0.5) * 16,
      kind: isBone ? 'bone' : 'flesh',
      color: isBone ? '#ebe3ce' : (i % 3 === 0 ? '#540101' : (i % 2 === 0 ? '#960505' : '#cf0e0e')),
      life: 24 + Math.random() * 14
    });
  }
  if (goreChunks.length > 360) goreChunks.splice(0, 60);

  for (let j = 0; j < (heavy ? 42 : 22); j++) {
    const a = angle + (Math.random() - 0.5) * 1.1;
    const spd = 140 + Math.random() * 430;
    particles.push({
      x, y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      color: j % 2 === 0 ? '#850202' : '#d40c0c',
      size: 3.6 + Math.random() * 4.8, life: 0.42 + Math.random() * 0.35, stain: true
    });
  }
}

function fireWeapon(shooter, now) {
  if (gameState === 'FREEZE_TIME') return;
  const w = shooter.inventory[shooter.activeSlot];
  if (!w || w.kind === 'c4' || shooter.reloading) return;
  if (now - shooter.lastShot < w.fireRate) return;

  if (w.kind === 'grenade') {
    shooter.lastShot = now;
    throwGrenade(shooter, w);
    return;
  }

  if (w.magSize > 0) {
    if (w.ammo <= 0) { startReload(shooter); return; }
    w.ammo--;
  }

  shooter.lastShot = now;
  shooter.muzzleFlash = 3;
  shooter.swingAnim = 1.0;
  shooter.recoilOffset = Math.min(0.24, shooter.recoilOffset + w.recoil);

  const p = getPlayer();
  const volScale = shooter.isPlayer ? 1.0 : (p ? Math.max(0.04, 1 - dist(shooter, p) / 1400) : 0.5);
  playSound(w.sound, volScale);
  if (shooter.isPlayer) screenShake = Math.min(11, screenShake + w.recoil * 48);

  const muzzleDist = shooter.radius + w.length;
  const mx = shooter.x + Math.cos(shooter.angle) * muzzleDist;
  const my = shooter.y + Math.sin(shooter.angle) * muzzleDist;

  if (w.magSize > 0) {
    const ejectAngle = shooter.angle + Math.PI / 2 + (Math.random() - 0.5) * 0.4;
    casings.push({
      x: shooter.x + Math.cos(shooter.angle) * 14,
      y: shooter.y + Math.sin(shooter.angle) * 14,
      vx: Math.cos(ejectAngle) * (80 + Math.random() * 45),
      vy: Math.sin(ejectAngle) * (80 + Math.random() * 45),
      rot: Math.random() * Math.PI, vrot: (Math.random() - 0.5) * 18, life: 2.5
    });
  }

  if (w.kind === 'melee') {
    shooter.vx += Math.cos(shooter.angle) * 145;
    shooter.vy += Math.sin(shooter.angle) * 145;
    palms.forEach(pl => {
      if (dist(shooter, pl) <= pl.r + 38) disturbTree(pl, (Math.random() > 0.5 ? 1 : -1) * 8, 10);
    });
    entities.forEach(target => {
      if (target.alive && isHostile(shooter, target)) {
        const d = dist(shooter, target);
        const angleToTarget = Math.atan2(target.y - shooter.y, target.x - shooter.x);
        if (d <= w.range + target.radius && Math.abs(normalizeAngle(angleToTarget - shooter.angle)) < 0.88) {
          const backstab = Math.abs(normalizeAngle(target.angle - shooter.angle)) < 0.85;
          if (backstab) playSound('knife_stab', volScale);
          damageEntity(shooter, target, backstab ? 190 : w.damage, shooter.angle, backstab, w.name);
        }
      }
    });
    return;
  }

  const diff = getDiffParams();
  const pellets = w.cat === 'SHOTGUN' && w.fireRate > 200 ? 6 : 1;
  for (let k = 0; k < pellets; k++) {
    const speedPenalty = shooter.moving ? 0.055 : 0;
    const aiPenalty = shooter.isPlayer ? 0 : diff.accSpread;
    const finalAngle = shooter.angle + (Math.random() - 0.5) * (w.spread + shooter.recoilOffset + speedPenalty + aiPenalty);
    const dmgVal = pellets > 1 ? Math.round(w.damage / 3.2) : w.damage;
    bullets.push({
      x: mx, y: my, px: mx, py: my,
      vx: Math.cos(finalAngle) * 3500, vy: Math.sin(finalAngle) * 3500,
      angle: finalAngle,
      damage: shooter.isPlayer ? dmgVal : Math.round(dmgVal * diff.dmgMult),
      weaponKey: w.key, weaponName: w.name, cat: w.cat,
      shooterId: shooter.id, shooterName: shooter.name, shooterTeam: shooter.team, isPlayer: shooter.isPlayer,
      distTraveled: 0, maxRange: w.range, headshotChance: shooter.moving ? 0.14 : 0.34,
      smokePunchDone: false
    });
  }
}

function damageEntity(attacker, target, dmg, angle, isHeadshot, customWeaponName = null) {
  let finalDmg = isHeadshot ? dmg * 2.85 : dmg;
  if (isHeadshot && target.hasHelmet) finalDmg *= 0.68;
  else if (!isHeadshot && target.armor > 0) {
    const absorbed = Math.min(target.armor, finalDmg * 0.45);
    target.armor -= absorbed;
    finalDmg -= absorbed * 0.55;
  }

  target.hp -= Math.round(finalDmg);
  target.vx += Math.cos(angle) * 135;
  target.vy += Math.sin(angle) * 135;

  const p = getPlayer();
  const hitVol = (attacker.isPlayer || target.isPlayer) ? 1.0 : (p ? Math.max(0.08, 1 - dist(target, p) / 1200) : 0.4);

  if (isHeadshot) {
    playSound('headshot', hitVol);
    playSound('gore_burst', hitVol);
  } else {
    playSound('flesh_hit', hitVol);
  }

  const count = isHeadshot ? 42 : 24;
  for (let i = 0; i < count; i++) {
    const a = angle + (Math.random() - 0.5) * 1.15;
    const spd = 110 + Math.random() * (isHeadshot ? 410 : 300);
    particles.push({
      x: target.x, y: target.y, vx: Math.cos(a) * spd, vy: Math.sin(a) * spd,
      color: i % 3 === 0 ? '#520101' : (Math.random() > 0.35 ? '#8a0404' : '#db1010'),
      size: 3.4 + Math.random() * 4.5, life: 0.4 + Math.random() * 0.3, stain: true
    });
  }

  const poolCount = isHeadshot ? 14 : 7;
  for (let s = 0; s < poolCount; s++) {
    const dOut = 6 + s * 13 + Math.random() * 14;
    const aOut = angle + (Math.random() - 0.5) * 0.7;
    bloodDecals.push({
      x: target.x + Math.cos(aOut) * dOut, y: target.y + Math.sin(aOut) * dOut,
      rx: 12 + Math.random() * 15, ry: 6 + Math.random() * 8, rot: aOut, alpha: 0.9
    });
  }
  if (bloodDecals.length > 520) bloodDecals.splice(0, 60);

  if (target.hp <= 0 && target.alive) {
    target.hp = 0; target.alive = false; target.deathAnim = 0; target.respawnTimer = 2.6;
    target.vx = Math.cos(angle) * 240; target.vy = Math.sin(angle) * 240;
    playSound('gore_burst', hitVol);
    spawnGoreBurst(target.x, target.y, angle, isHeadshot || dmg >= 80);

    if (typeof attacker.frags === 'number') attacker.frags++;

    if (settings.gameMode === 'DEATHMATCH') {
      if (attacker.isPlayer) playerFrags++;
    } else {
      if (attacker.team === 'T') tScore++; else ctScore++;
    }

    if (bomb.state === 'CARRIED' && bomb.carrierId === target.id) {
      target.inventory[4] = null; bomb.state = 'DROPPED'; bomb.carrierId = null;
      bomb.x = target.x; bomb.y = target.y;
    }

    if (attacker.isPlayer) {
      const wKey = attacker.inventory[attacker.activeSlot]?.key;
      const reward = wKey === 'awp' ? 100 : (wKey === 'knife' ? 1500 : 300);
      playerMoney = Math.min(16000, playerMoney + reward);
    }

    killFeed.unshift({
      killer: attacker.name, kTeam: attacker.team,
      victim: target.name, vTeam: target.team,
      weapon: customWeaponName || attacker.inventory[attacker.activeSlot]?.name || 'C4',
      headshot: isHeadshot, timer: 5.5
    });
    if (killFeed.length > 5) killFeed.pop();
  }
}

function spawnSparks(x, y, angle) {
  for (let i = 0; i < 6; i++) {
    const bounce = angle + Math.PI + (Math.random() - 0.5) * 1.4;
    particles.push({
      x, y, vx: Math.cos(bounce) * (120 + Math.random() * 190),
      vy: Math.sin(bounce) * (120 + Math.random() * 190),
      color: '#ffe270', size: 2.5, life: 0.22, stain: false
    });
  }
}

function endRound(winnerTeam, reason, winBonus, loseBonus) {
  if (gameState === 'ROUND_END') return;
  gameState = 'ROUND_END'; phaseTimer = 4.0;
  if (winnerTeam === 'CT') {
    tLossStreak = Math.min(4, tLossStreak + 1); ctLossStreak = 0;
    roundWinnerText = 'COUNTER-TERRORISTS WIN'; roundSubText = reason;
    playerMoney = Math.min(16000, playerMoney + (playerTeam === 'CT' ? winBonus : loseBonus + tLossStreak * 500));
  } else {
    ctLossStreak = Math.min(4, ctLossStreak + 1); tLossStreak = 0;
    roundWinnerText = 'TERRORISTS WIN'; roundSubText = reason;
    playerMoney = Math.min(16000, playerMoney + (playerTeam === 'T' ? winBonus : loseBonus + ctLossStreak * 500));
  }
}

let lastTime = performance.now();
function update(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (dt > 0) fpsDisplay = fpsDisplay * 0.92 + (1 / dt) * 0.08;

  const filterAlpha = settings.mouseFilter ? Math.min(1, dt * 16) : 1;

  mouse.smoothY += (mouse.y - mouse.smoothY) * filterAlpha;

  if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 42);
  if (flashAlpha > 0) flashAlpha = Math.max(0, flashAlpha - dt * 0.36);

  palms.forEach(pl => {
    if (pl.hitCooldown > 0) pl.hitCooldown -= dt;
    const springK = 28, damping = 5.5;
    const accel = -springK * pl.angleOffset - damping * pl.angleVel;
    pl.angleVel += accel * dt;
    pl.angleOffset += pl.angleVel * dt;

    if (pl.burning && pl.burnAmount < 1.0) {
      pl.burnAmount = Math.min(1.0, pl.burnAmount + dt * 0.095);
      pl.emberAccum += dt;
      if (pl.emberAccum >= 0.16) {
        pl.emberAccum = 0;
        const a = Math.random() * Math.PI * 2;
        const r = Math.random() * pl.r * 0.7;
        particles.push({
          x: pl.x + Math.cos(a) * r, y: pl.y + Math.sin(a) * r,
          vx: (Math.random() - 0.5) * 35, vy: -30 - Math.random() * 55,
          color: Math.random() > 0.4 ? '#ff9d1c' : '#ff3b14',
          size: 2.5 + Math.random() * 3, life: 0.3 + Math.random() * 0.25, stain: false
        });
      }
      if (pl.burnAmount >= 1.0) {
        pl.burning = false;
        spawnScorch(pl.x, pl.y, pl.r * 0.75, 0.45);
      }
    }
  });

  for (let i = leaves.length - 1; i >= 0; i--) {
    const lf = leaves[i];
    lf.x += lf.vx * dt; lf.y += lf.vy * dt;
    lf.vx *= 0.94; lf.vy = lf.vy * 0.95 + 12 * dt;
    lf.rot += lf.vrot * dt; lf.life -= dt;
    if (lf.life <= 0) leaves.splice(i, 1);
  }

  for (let i = smokeClearings.length - 1; i >= 0; i--) {
    smokeClearings[i].life -= dt;
    if (smokeClearings[i].life <= 0) smokeClearings.splice(i, 1);
  }

  ambientMotes.forEach(m => {
    m.x += m.vx * dt; m.y += m.vy * dt;
    if (dist(m, { x: WORLD_CX, y: WORLD_CY }) > 1750) {
      const a = Math.random() * Math.PI * 2;
      m.x = WORLD_CX + Math.cos(a) * 1250; m.y = WORLD_CY + Math.sin(a) * 1250;
    }
  });

  if (['MAIN_MENU', 'CREATE_SERVER', 'OPTIONS', 'TEAM_SELECT', 'CLASS_SELECT'].includes(gameState)) {
    mouse.clicked = false;
    return;
  }

  if (gameState === 'FREEZE_TIME') {
    phaseTimer -= dt;
    if (phaseTimer <= 0) { gameState = 'PLAYING'; phaseTimer = 115.0; }
  } else if (gameState === 'PLAYING') {
    if (settings.gameMode === 'CASUAL') {
      const tAlive = entities.filter(e => e.team === 'T' && e.alive).length;
      const ctAlive = entities.filter(e => e.team === 'CT' && e.alive).length;

      if (bomb.state === 'PLANTED' || bomb.state === 'DEFUSING') {
        bomb.fuseTimer -= dt;
        const beepInterval = Math.max(0.11, (bomb.fuseTimer / 40.0) * 0.95);
        bomb.beepAccum += dt;
        if (bomb.beepAccum >= beepInterval) {
          bomb.beepAccum = 0;
          const p = getPlayer();
          playSound('c4beep', p ? Math.max(0.15, 1 - dist(bomb, p) / 1800) : 0.5);
        }
        if (bomb.fuseTimer <= 0) triggerC4Explosion();
        else if (ctAlive === 0) endRound('T', 'COUNTER-TERRORISTS ELIMINATED', 3250, 1400);
      } else {
        phaseTimer -= dt;
        if (ctAlive === 0) endRound('T', 'COUNTER-TERRORISTS ELIMINATED', 3250, 1400);
        else if (tAlive === 0) endRound('CT', 'TERRORISTS ELIMINATED', 3250, 1400);
        else if (phaseTimer <= 0) endRound('CT', 'TARGET HAS BEEN SAVED', 3250, 1400);
      }
    } else {
      phaseTimer -= dt;
      if (phaseTimer <= 0) {
        roundNumber++;
        phaseTimer = 300.0;
      }
    }
  } else if (gameState === 'ROUND_END') {
    phaseTimer -= dt;
    if (phaseTimer <= 0) { roundNumber++; setupRound(); }
  }

  const player = getPlayer();
  const camX = player ? player.x - canvas.width / 2 : WORLD_CX - canvas.width / 2;
  const camY = player ? player.y - canvas.height / 2 : WORLD_CY - canvas.height / 2;

  if (settings.gameMode === 'CASUAL') {
    if (bomb.state === 'CARRIED') {
      const carrier = entities.find(e => e.id === bomb.carrierId && e.alive);
      if (carrier) { bomb.x = carrier.x; bomb.y = carrier.y; }

    } else if (bomb.state === 'DROPPED') {
      for (let e of entities) {

  const diff = getDiffParams();

  entities.forEach((ent, entIdx) => {
    if (!ent.alive) {

      ent.vx *= 0.82; ent.vy *= 0.82;
      for (let w of walls) {
        if (circleRectCollide(ent.x, ent.y, ent.radius * 0.7, w)) {
          ent.x -= ent.vx * dt; ent.y -= ent.vy * dt; ent.vx = 0; ent.vy = 0; break;
        }
      }
      if (settings.gameMode === 'DEATHMATCH' && gameState === 'PLAYING') {
        ent.respawnTimer -= dt;
        if (ent.respawnTimer <= 0) respawnEntity(ent, entIdx);
      }
      return;
    }

    if (ent.muzzleFlash > 0) ent.muzzleFlash--;
    if (ent.swingAnim > 0) ent.swingAnim = Math.max(0, ent.swingAnim - dt * 5.2);
    ent.recoilOffset = Math.max(0, ent.recoilOffset - dt * 0.42);

    if (ent.reloading && now >= ent.reloadEnd) {
      const w = ent.inventory[ent.activeSlot];
      if (w) {
        const needed = w.magSize - w.ammo;
        const load = Math.min(needed, w.reserve);
        w.ammo += load; w.reserve -= load;
      }
      ent.reloading = false;
    }

    let ix = 0, iy = 0;
    let isPlantingOrDefusing = false;

    if (ent.isPlayer) {
      const aimX = mouse.smoothX + camX;
      const aimY = mouse.smoothY + camY;
      const baseAng = Math.atan2(aimY - ent.y, aimX - ent.x);
      const sensFactor = Math.max(0.6, Math.min(1.6, 0.85 + (settings.mouseSensitivity - 2.5) * 0.035));
      ent.angle = lerpAngle(ent.angle, baseAng, Math.min(1, dt * 28 * sensFactor));

      if (gameState !== 'FREEZE_TIME') {
        if (keys['w'] || keys['arrowup']) iy -= 1;
        if (keys['s'] || keys['arrowdown']) iy += 1;
        if (keys['a'] || keys['arrowleft']) ix -= 1;
        if (keys['d'] || keys['arrowright']) ix += 1;

        if (settings.gameMode === 'CASUAL') {
          const siteHere = getSiteAt(ent.x, ent.y);
          const holdingC4 = ent.activeSlot === 4 && bomb.state === 'CARRIED' && bomb.carrierId === ent.id;
          if (ent.team === 'T' && siteHere && ((keys['e'] && bomb.state === 'CARRIED' && bomb.carrierId === ent.id) || (holdingC4 && mouse.down))) {
            isPlantingOrDefusing = true;
            bomb.plantProgress += dt;
            bomb.plantSoundAccum += dt;
            if (bomb.plantSoundAccum >= 0.42) { bomb.plantSoundAccum = 0; playSound('c4plant_tick', 0.9); }
            if (bomb.plantProgress >= 3.2) {
              bomb.state = 'PLANTED'; bomb.site = siteHere; bomb.x = ent.x; bomb.y = ent.y; bomb.fuseTimer = 40.0;
              ent.inventory[4] = null; ent.activeSlot = ent.inventory[1] ? 1 : 2;
              playerMoney = Math.min(16000, playerMoney + 300); playSound('c4plant', 1);
              pushRadio(ent.name, ent.team, 'Bomb has been planted.');
            }
          } else if (bomb.state === 'CARRIED' && bomb.carrierId === ent.id) {
            bomb.plantProgress = 0; bomb.plantSoundAccum = 0;
          }

          if (ent.team === 'CT' && (bomb.state === 'PLANTED' || bomb.state === 'DEFUSING') && dist(ent, bomb) < 48 && keys['e']) {
            isPlantingOrDefusing = true;
            bomb.state = 'DEFUSING';
            bomb.defuseProgress += dt / (ent.hasDefuseKit ? 5.0 : 10.0);
            bomb.defuseSoundAccum += dt;
            if (bomb.defuseSoundAccum >= 0.5) { bomb.defuseSoundAccum = 0; playSound('c4plant_tick', 0.8); }
            if (bomb.defuseProgress >= 1.0) {
              bomb.state = 'DEFUSED'; playSound('c4defuse', 1);
              playerMoney = Math.min(16000, playerMoney + 300); endRound('CT', 'BOMB HAS BEEN DEFUSED', 3500, 1400);
            }
          } else if (ent.team === 'CT' && bomb.state === 'DEFUSING') {
            bomb.state = 'PLANTED'; bomb.defuseProgress = 0; bomb.defuseSoundAccum = 0;
          }
        }

        const activeW = ent.inventory[ent.activeSlot];
        if (!buyMenuOpen && !isPlantingOrDefusing && activeW && activeW.kind !== 'c4') {
          if ((activeW.auto && mouse.down) || (!activeW.auto && mouse.clicked)) fireWeapon(ent, now);
        }
      }
    } else if (gameState !== 'FREEZE_TIME') {
      ent.aiTimer -= dt; ent.aiNadeCooldown -= dt;

      for (let fp of firePatches) {
        if (dist(ent, fp) < fp.radius + 32) {
          const awayA = Math.atan2(ent.y - fp.y, ent.x - fp.x);
          ix += Math.cos(awayA) * 1.6; iy += Math.sin(awayA) * 1.6;
        }
      }

      let nearestEnemy = null; let bestDist = 1220;
      entities.forEach(other => {
        if (other.alive && isHostile(ent, other) && !isPointInSmoke(other.x, other.y)) {
          const d = dist(ent, other);
          if (d < bestDist && hasLineOfSight(ent.x, ent.y, other.x, other.y)) { bestDist = d; nearestEnemy = other; }
        }
      });

      if (nearestEnemy) {
        ent.spotTimer += dt * 1000;
        const aimAngle = Math.atan2(nearestEnemy.y - ent.y, nearestEnemy.x - ent.x);
        ent.angle = lerpAngle(ent.angle, aimAngle, diff.aimLerp);

        const prim = ent.inventory[1];
        const sec = ent.inventory[2];
        const outOfAmmo = (!prim || prim.ammo <= 0 && prim.reserve <= 0) && (!sec || sec.ammo <= 0 && sec.reserve <= 0);
        if (outOfAmmo && bestDist < 170) ent.activeSlot = 3;
        else if (prim && prim.ammo > 0 && ent.activeSlot !== 1 && ent.activeSlot !== 5) ent.activeSlot = 1;

        if (ent.inventory[5] && ent.aiNadeCooldown <= 0 && bestDist > 210 && bestDist < 740) {
          ent.aiNadeCooldown = 5.5 + Math.random() * 4.5;
          throwGrenade(ent, ent.inventory[5]);
        } else {
          if (ent.aiTimer <= 0) {
            ent.aiTimer = 0.55 + Math.random() * 0.65;
            if (Math.random() < 0.35) ent.aiStrafeDir *= -1;
          }
          const perpAngle = aimAngle + (Math.PI / 2) * ent.aiStrafeDir;
          const advanceFactor = bestDist > 330 && ent.inventory[ent.activeSlot]?.key !== 'awp' ? 0.72 : -0.15;
          ix += Math.cos(aimAngle) * advanceFactor + Math.cos(perpAngle) * 0.85;
          iy += Math.sin(aimAngle) * advanceFactor + Math.sin(perpAngle) * 0.85;
          if (ent.spotTimer >= diff.reactionMs) fireWeapon(ent, now);
        }
      } else {
        ent.spotTimer = 0;
        if (ent.inventory[1] && ent.inventory[1].ammo > 0 && ent.activeSlot === 3) ent.activeSlot = 1;
        if (ent.aiTimer <= 0) {
          ent.aiTimer = 0.8 + Math.random() * 0.95;
          let goalX = 1560, goalY = 980;
          if (settings.gameMode === 'DEATHMATCH') {
            goalX = 760 + Math.random() * 1750;
            goalY = 540 + Math.random() * 1450;
          } else if (bomb.state === 'PLANTED' || bomb.state === 'DEFUSING') {
            if (ent.team === 'CT') { goalX = bomb.x; goalY = bomb.y; }
            else {
              const guardAng = (ent.id.charCodeAt(ent.id.length - 1) * 1.35) + now * 0.0004;
              goalX = bomb.x + Math.cos(guardAng) * 145;
              goalY = bomb.y + Math.sin(guardAng) * 145;
            }
          } else if (ent.team === 'T' && bomb.state === 'DROPPED') {
            goalX = bomb.x; goalY = bomb.y;
          } else if (ent.team === 'T') {
            goalX = ent.aiPlan === 'A' ? (ent.aiRole === 'FLANK' ? 2310 : 2195) : (ent.aiRole === 'FLANK' ? 920 : 1090);
            goalY = ent.aiPlan === 'A' ? 875 : 1650;
          } else {
            goalX = ent.aiPlan === 'A' ? (ent.aiRole === 'ROTATE' ? 1560 : 2180) : (ent.aiRole === 'ROTATE' ? 1480 : 1080);
            goalY = ent.aiPlan === 'A' ? (ent.aiRole === 'ROTATE' ? 1120 : 860) : (ent.aiRole === 'ROTATE' ? 1420 : 1640);
          }
          const a = Math.atan2(goalY - ent.y, goalX - ent.x) + (Math.random() - 0.5) * 0.45;
          ent.aiMoveDir = { x: Math.cos(a), y: Math.sin(a) };

      ent.x += ent.vx * dt;
      for (let i = 0; i < walls.length; i++) {

      for (let i = 0; i < walls.length; i++) {

          ent.y -= ent.vy * dt; ent.vy = 0; if (!ent.isPlayer) ent.aiTimer = 0; break;
        }
      }
    } else {

  });

  for (let i = grenades.length - 1; i >= 0; i--) {

    const prevX = g.x, prevY = g.y;
    g.x += g.vx * dt;
    for (let w of walls) {
      if (circleRectCollide(g.x, g.y, 7, w)) { g.x = prevX; g.vx = -g.vx * 0.52; g.vy *= 0.82; playSound('bounce', 0.45); break; }

    for (let w of walls) {
      if (circleRectCollide(g.x, g.y, 7, w)) { g.y = prevY; g.vy = -g.vy * 0.52; g.vx *= 0.82; playSound('bounce', 0.45); break; }

    if (g.fuse <= 0) { detonateGrenade(g); grenades.splice(i, 1); }
  }

  for (let i = firePatches.length - 1; i >= 0; i--) {
    const fp = firePatches[i];
    fp.life -= dt; fp.burnTick += dt; fp.spreadTimer -= dt;
    fp.x += fp.vx * dt; fp.y += fp.vy * dt; fp.vx *= 0.9; fp.vy *= 0.9;
    const ownerMeta = { ownerId: fp.ownerId, ownerTeam: fp.ownerTeam, ownerName: fp.ownerName, isPlayer: fp.isPlayer };

    palms.forEach(pl => {
      if (dist(fp, pl) < fp.radius + pl.r * 0.72) ignitePalm(pl, ownerMeta);
    });

    if (fp.spreadTimer <= 0 && fp.spreadsLeft > 0) {
      fp.spreadsLeft--;
      fp.spreadTimer = 1.15 + Math.random() * 0.7;

      let blocked = false;

      }
      if (!blocked && firePatches.length < 34) {

      }
    }

    if (Math.random() < 0.72) {
      particles.push({
        x: fp.x + (Math.random() - 0.5) * fp.radius, y: fp.y + (Math.random() - 0.5) * fp.radius,
        vx: (Math.random() - 0.5) * 45, vy: -35 - Math.random() * 65,
        color: Math.random() > 0.4 ? '#ff9d1c' : '#ff3b14', size: 3 + Math.random() * 3.5,

      entities.forEach(t => {

        }
      });
