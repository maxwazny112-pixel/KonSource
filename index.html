  }

  // Multi-puff reactive smoke physics: turbulence, wall banking/bounce & puff-to-puff repulsion
  for (let i = smokeClouds.length - 1; i >= 0; i--) {
    const sc = smokeClouds[i];
    sc.life -= dt;
    sc.radius += (sc.targetRadius - sc.radius) * Math.min(1, dt * 3.4);
    const turbX = Math.sin(now * 0.0022 + sc.driftSeed) * 16;
    const turbY = Math.cos(now * 0.0018 + sc.driftSeed * 1.7) * 14;

    for (let j = i - 1; j >= 0; j--) {
      const other = smokeClouds[j];
      const dx = sc.x - other.x, dy = sc.y - other.y;
      const d = Math.hypot(dx, dy);
      const minSep = (sc.radius + other.radius) * 0.42;
      if (d > 1 && d < minSep) {
        const push = ((minSep - d) / minSep) * 14 * dt;
        sc.vx += (dx / d) * push;
        sc.vy += (dy / d) * push;
      }
    }

    const px = sc.x, py = sc.y;
    sc.x += (sc.vx + turbX) * dt;
    for (let w of walls) {
      if (circleRectCollide(sc.x, sc.y, sc.radius * 0.45, w)) {
        sc.x = px; sc.vx = -sc.vx * 0.35; break;
      }
    }
    sc.y += (sc.vy + turbY) * dt;
    for (let w of walls) {
      if (circleRectCollide(sc.x, sc.y, sc.radius * 0.45, w)) {
        sc.y = py; sc.vy = -sc.vy * 0.35; break;
      }
    }
    sc.vx *= Math.pow(0.45, dt);
    sc.vy *= Math.pow(0.45, dt);
    if (sc.life <= 0) smokeClouds.splice(i, 1);
  }

  for (let i = explosions.length - 1; i >= 0; i--) {
    const ex = explosions[i];
    ex.life -= dt * (ex.isC4 ? 1.4 : 2.2);
    ex.radius += (ex.maxRadius - ex.radius) * Math.min(1, dt * (ex.isC4 ? 9 : 14));
    if (ex.life <= 0) explosions.splice(i, 1);
  }

  for (let i = bullets.length - 1; i >= 0; i--) {
    const b = bullets[i];
    b.px = b.x; b.py = b.y;
    const stepX = b.vx * dt; const stepY = b.vy * dt;
    b.x += stepX; b.y += stepY; b.distTraveled += Math.hypot(stepX, stepY);
    let remove = b.distTraveled >= b.maxRange;

    if (!b.smokePunchDone) {
      for (let sc of smokeClouds) {
        if (dist({ x: b.x, y: b.y }, sc) < sc.radius * 0.98) {
          b.smokePunchDone = true;
          punchSmokeHole(b.x, b.y, b.weaponKey === 'awp' || b.cat === 'SHOTGUN' ? 68 : 46);
          break;
        }
      }
    }

    for (let pl of palms) {
      if (dist(b, pl) < pl.r * 0.72) disturbTree(pl, Math.sin(b.angle) * 6.5, 6);
    }

    if (!remove) {
      for (let w of walls) {
        if (b.x >= w.x && b.x <= w.x + w.w && b.y >= w.y && b.y <= w.y + w.h) {
          spawnSparks(b.x, b.y, b.angle);
          bulletHoles.push({ x: b.x, y: b.y, r: b.weaponKey === 'awp' ? 4.5 : 3.2, alpha: 0.75, scorch: false });
          if (bulletHoles.length > 360) bulletHoles.shift();
          remove = true; break;
        }
      }
    }

    if (!remove) {
      const shooterObj = { id: b.shooterId, team: b.shooterTeam };
      for (let target of entities) {
        if (!target.alive || !isHostile(shooterObj, target)) continue;
        if (dist(b, target) <= target.radius + 3) {
          const attacker = entities.find(e => e.id === b.shooterId) || { id: b.shooterId, name: b.shooterName, team: b.shooterTeam, isPlayer: b.isPlayer, inventory: {} };
          damageEntity(attacker, target, b.damage, b.angle, Math.random() < b.headshotChance);
          remove = true; break;
        }
      }
    }
    if (remove) bullets.splice(i, 1);
  }

  for (let i = casings.length - 1; i >= 0; i--) {
    const c = casings[i];
    c.x += c.vx * dt; c.y += c.vy * dt; c.vx *= 0.9; c.vy *= 0.9;
    c.rot += c.vrot * dt; c.vrot *= 0.9; c.life -= dt;
    if (c.life <= 0) casings.splice(i, 1);
  }

  for (let i = goreChunks.length - 1; i >= 0; i--) {
    const gc = goreChunks[i];
    const px = gc.x, py = gc.y;
    gc.x += gc.vx * dt; gc.y += gc.vy * dt;
    for (let w of walls) {
      if (circleRectCollide(gc.x, gc.y, gc.r, w)) { gc.x = px; gc.vx = -gc.vx * 0.45; gc.vy *= 0.7; break; }
    }
    gc.vx *= 0.84; gc.vy *= 0.84;
    gc.rot += gc.vrot * dt; gc.vrot *= 0.86;
    gc.life -= dt;
    if (gc.life <= 0) goreChunks.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.x += pt.vx * dt; pt.y += pt.vy * dt; pt.vx *= 0.92; pt.vy *= 0.92; pt.life -= dt;
    if (pt.life <= 0) {
      if (pt.stain && Math.random() < 0.75) {
        bloodDecals.push({ x: pt.x, y: pt.y, rx: pt.size * 1.8, ry: pt.size * 1.1, rot: Math.random() * Math.PI, alpha: 0.82 });
      }
      particles.splice(i, 1);
    }
  }

  killFeed.forEach(k => k.timer -= dt); killFeed = killFeed.filter(k => k.timer > 0);
  radioFeed.forEach(r => r.timer -= dt); radioFeed = radioFeed.filter(r => r.timer > 0);
  mouse.clicked = false;
}

function render() {
  ctx.fillStyle = '#070912';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (gameState === 'MAIN_MENU') {
    drawCS16MainMenu();
    drawCrosshair();
    return;
  }

  if (gameState === 'CREATE_SERVER') {
    drawCS16MainMenu();
    drawCS16CreateServerWindow();
    drawCrosshair();
    return;
  }

  if (gameState === 'OPTIONS') {
    drawCS16MainMenu();
    drawCS16OptionsWindow();
    drawCrosshair();
    return;
  }

  if (gameState === 'TEAM_SELECT' || gameState === 'CLASS_SELECT') {
    drawCS16VGUISelection();
    drawCrosshair();
    return;
  }

  const player = getPlayer();
  const shakeX = (Math.random() - 0.5) * screenShake;
  const shakeY = (Math.random() - 0.5) * screenShake;
  const camX = (player ? player.x - canvas.width / 2 : WORLD_CX - canvas.width / 2) + shakeX;
  const camY = (player ? player.y - canvas.height / 2 : WORLD_CY - canvas.height / 2) + shakeY;

  ctx.save();
  ctx.translate(-Math.round(camX), -Math.round(camY));

  ctx.fillStyle = textures.sand;
  ctx.fillRect(200, 100, 3100, 2400);

  roadZones.forEach(rz => {
    ctx.fillStyle = textures.cobble;
    roundRect(ctx, rz.x, rz.y, rz.w, rz.h, rz.r);
    ctx.fill();
    ctx.strokeStyle = 'rgba(38, 28, 16, 0.58)';
    ctx.lineWidth = 2.5;
    ctx.stroke();
  });

  if (settings.gameMode === 'CASUAL') {
    ctx.strokeStyle = 'rgba(72, 224, 118, 0.35)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(860, 2000, 340, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.arc(1820, 520, 340, 0, Math.PI * 2); ctx.stroke();

    bombSites.forEach(s => {
      ctx.fillStyle = 'rgba(218, 48, 48, 0.12)';
      roundRect(ctx, s.x, s.y, s.w, s.h, 12);
      ctx.fill();
      ctx.strokeStyle = 'rgba(225, 55, 55, 0.65)';
      ctx.lineWidth = 3;
      roundRect(ctx, s.x, s.y, s.w, s.h, 12);
      ctx.stroke();

      ctx.save();
      ctx.font = 'bold 84px "Arial Narrow", "Impact", sans-serif';
      ctx.fillStyle = 'rgba(215, 45, 45, 0.25)';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(s.id, s.x + s.w / 2, s.y + s.h / 2);
      ctx.restore();
    });
  }

  bulletHoles.forEach(h => {
    if (h.scorch) {
      const sg = ctx.createRadialGradient(h.x, h.y, 4, h.x, h.y, h.r);
      sg.addColorStop(0, `rgba(16, 14, 13, ${h.alpha})`);
      sg.addColorStop(0.6, `rgba(42, 34, 26, ${h.alpha * 0.55})`);
      sg.addColorStop(1, 'rgba(0,0,0,0)');
      ctx.fillStyle = sg;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = `rgba(24, 19, 14, ${h.alpha})`;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2); ctx.fill();
    }
  });

  bloodDecals.forEach(b => {
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot || 0);
    const bg = ctx.createRadialGradient(0, 0, 1, 0, 0, Math.max(b.rx, b.ry));
    bg.addColorStop(0, `rgba(145, 3, 3, ${b.alpha})`);
    bg.addColorStop(0.55, `rgba(102, 2, 2, ${b.alpha * 0.75})`);
    bg.addColorStop(1, 'rgba(68, 0, 0, 0)');
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, 0, b.rx, b.ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  goreChunks.forEach(gc => {
    ctx.save();
    ctx.translate(gc.x, gc.y);
    ctx.rotate(gc.rot);
    ctx.fillStyle = gc.color;
    if (gc.kind === 'bone') {
      ctx.fillRect(-gc.r * 1.4, -gc.r * 0.45, gc.r * 2.8, gc.r * 0.9);
    } else {
      ctx.beginPath(); ctx.ellipse(0, 0, gc.r * 1.35, gc.r * 0.85, 0, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  });

  firePatches.forEach(fp => {
    const fg = ctx.createRadialGradient(fp.x, fp.y, 4, fp.x, fp.y, fp.radius);
    fg.addColorStop(0, 'rgba(255, 235, 130, 0.82)');
    fg.addColorStop(0.45, 'rgba(255, 115, 20, 0.64)');
    fg.addColorStop(1, 'rgba(210, 35, 10, 0)');
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(fp.x, fp.y, fp.radius, 0, Math.PI * 2); ctx.fill();
  });

  casings.forEach(c => {
    ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = '#ecc03b'; ctx.fillRect(-3.5, -1.3, 7, 2.6);
    ctx.restore();
  });

  entities.filter(e => !e.alive).forEach(e => drawSoldier(e));

  if (settings.gameMode === 'CASUAL' && bomb.state !== 'CARRIED' && bomb.state !== 'NONE') drawBombEntity(bomb);
  grenades.forEach(g => drawGrenade(g));

  walls.forEach(w => {
    const ext = w.h3d || 36;
    ctx.fillStyle = 'rgba(0, 0, 0, 0.36)';
    roundRect(ctx, w.x + ext * 0.55, w.y + ext * 0.65, w.w, w.h, w.r || 8); ctx.fill();
    ctx.fillStyle = w.type === 'crate' ? '#5c3712' : (w.type === 'car' ? '#666e78' : '#5e4930');
    roundRect(ctx, w.x, w.y + ext, w.w, w.h, w.r || 8); ctx.fill();

    if (w.type === 'crate') {
      ctx.drawImage(textures.crate, w.x, w.y, w.w, w.h);
    } else if (w.type === 'car') {
      ctx.fillStyle = w.color || '#d5dce4';
      roundRect(ctx, w.x, w.y, w.w, w.h, 10); ctx.fill();
    } else {
      ctx.fillStyle = textures.wallStone;
      roundRect(ctx, w.x, w.y, w.w, w.h, w.r || 8); ctx.fill();
      ctx.strokeStyle = 'rgba(255, 236, 192, 0.35)'; ctx.lineWidth = 2; ctx.stroke();
      if (w.dome) {
        const dx = w.x + w.w * 0.5, dy = w.y + w.h * 0.5, dr = Math.min(w.w, w.h) * 0.24;
        const dg = ctx.createRadialGradient(dx - dr * 0.35, dy - dr * 0.35, dr * 0.1, dx, dy, dr);
        dg.addColorStop(0, '#ead09b'); dg.addColorStop(0.65, '#c49d64'); dg.addColorStop(1, '#856233');
        ctx.fillStyle = dg;
        ctx.beginPath(); ctx.arc(dx, dy, dr, 0, Math.PI * 2); ctx.fill();
      }
    }
  });

  const nowSec = performance.now() * 0.001;
  palms.forEach(pl => drawReactivePalm(pl, nowSec));

  leaves.forEach(lf => {
    ctx.save(); ctx.translate(lf.x, lf.y); ctx.rotate(lf.rot);
    ctx.globalAlpha = Math.min(1, lf.life); ctx.fillStyle = lf.color;
    ctx.beginPath(); ctx.ellipse(0, 0, lf.len * 0.6, lf.len * 0.22, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  });

  entities.filter(e => e.alive).forEach(e => drawSoldier(e));

  bullets.forEach(b => {
    const grad = ctx.createLinearGradient(b.px, b.py, b.x, b.y);
    grad.addColorStop(0, 'rgba(255, 210, 90, 0.04)');
    grad.addColorStop(1, 'rgba(255, 250, 195, 0.96)');
    ctx.strokeStyle = grad; ctx.lineWidth = b.weaponKey === 'awp' ? 4 : 2.3;
    ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
  });

  particles.forEach(pt => {
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size * 0.65, 0, Math.PI * 2); ctx.fill();
  });

  explosions.forEach(ex => {
    const eg = ctx.createRadialGradient(ex.x, ex.y, ex.radius * 0.1, ex.x, ex.y, ex.radius);
    eg.addColorStop(0, `rgba(255, 248, 195, ${ex.life * 0.85})`);
    eg.addColorStop(0.5, `rgba(255, 120, 25, ${ex.life * 0.55})`);
    eg.addColorStop(1, 'rgba(200, 40, 10, 0)');
    ctx.fillStyle = eg; ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
  });

  smokeClouds.forEach(sc => {
    const fade = Math.min(1, sc.life / 2.2);
    ctx.save();
    ctx.beginPath();
    ctx.arc(sc.x, sc.y, sc.radius, 0, Math.PI * 2);
    for (let hole of smokeClearings) {
      if (hole.life > 0 && dist(sc, hole) < sc.radius + hole.radius) {
        const holeFade = Math.min(1, hole.life / 0.7);
        const hr = hole.radius * holeFade;
        ctx.moveTo(hole.x + hr, hole.y);
        ctx.arc(hole.x, hole.y, hr, 0, Math.PI * 2, true);
      }
    }
    const sg = ctx.createRadialGradient(sc.x, sc.y, sc.radius * 0.12, sc.x, sc.y, sc.radius);
    sg.addColorStop(0, `rgba(226, 230, 235, ${0.95 * fade})`);
    sg.addColorStop(0.68, `rgba(182, 188, 194, ${0.78 * fade})`);
    sg.addColorStop(1, 'rgba(155, 162, 168, 0)');
    ctx.fillStyle = sg;
    ctx.fill('nonzero');
    ctx.restore();
  });

  ambientMotes.forEach(m => {
    ctx.fillStyle = `rgba(255, 244, 210, ${m.a})`;
    ctx.beginPath(); ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2); ctx.fill();
  });

  ctx.restore();

  if (flashAlpha > 0.01) {
    ctx.fillStyle = `rgba(255, 255, 255, ${flashAlpha})`;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }

  drawCS16Radar(player);
  drawCS16HUD(player);
  drawBombPlantDefuseUI(player);
  if (buyMenuOpen) drawCS16VGUIBuyMenu(player);
  if (gameState === 'ROUND_END') drawCS16RoundBanner();
  drawCrosshair();
}

function drawReactivePalm(pl, tSec) {
  const sway = Math.sin(tSec * 1.4 + pl.phase) * 0.06 + pl.angleOffset;
  const charRatio = pl.burnAmount || 0;
  ctx.save();
  ctx.translate(pl.x, pl.y);
  ctx.fillStyle = 'rgba(0,0,0,0.28)';
  ctx.beginPath(); ctx.arc(10 + pl.angleOffset * 25, 12, pl.r * 0.88, 0, Math.PI * 2); ctx.fill();
  ctx.rotate(sway);

  for (let i = 0; i < 7; i++) {
    ctx.save();
    ctx.rotate((i / 7) * Math.PI * 2 + 0.25);
    let frondCol = i % 2 === 0 ? '#4a852b' : '#65a83c';
    if (charRatio > 0.65) frondCol = '#2b231d';
    else if (charRatio > 0.25) frondCol = i % 2 === 0 ? '#78481d' : '#9c6222';
    ctx.fillStyle = frondCol;
    ctx.beginPath();
    ctx.moveTo(0, -5); ctx.quadraticCurveTo(pl.r * 0.55, -13, pl.r * (1 - charRatio * 0.18), 0);
    ctx.quadraticCurveTo(pl.r * 0.55, 13, 0, 5); ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  ctx.fillStyle = charRatio > 0.3 ? '#2c1d12' : '#5c3c1e';
  ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}

function drawGrenade(g) {
  ctx.save(); ctx.translate(g.x, g.y); ctx.rotate(g.rot);
  const col = g.nadeType === 'he' ? '#4f6338' : (g.nadeType === 'flash' ? '#d8dee3' : (g.nadeType === 'smoke' ? '#7b848c' : '#c97222'));
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(0, 0, 6.5, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#181818'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.restore();
}

function drawBombEntity(b) {
  ctx.save(); ctx.translate(b.x, b.y);
  ctx.fillStyle = '#3f473c'; ctx.strokeStyle = '#121212'; ctx.lineWidth = 1.5;
  roundRect(ctx, -11, -8, 22, 16, 3); ctx.fill(); ctx.stroke();
  if (b.state === 'PLANTED' || b.state === 'DEFUSING') {
    const pulse = b.beepAccum < 0.085;
    ctx.fillStyle = pulse ? '#ff1e1e' : '#5e0000';
    ctx.beginPath(); ctx.arc(5, 0, pulse ? 5.2 : 2.8, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawSoldier(s) {
  const skin = SKIN_STYLES[s.classTitle] || {
    body: s.team === 'T' ? '#967449' : '#2a496e',
    trim: s.team === 'T' ? '#a82828' : '#6394c4',
    head: s.team === 'T' ? '#cc996d' : '#1f3047',
    hood: null, glasses: false, camo: false
  };

  ctx.save(); ctx.translate(s.x, s.y);
  ctx.fillStyle = 'rgba(0,0,0,0.36)';
  ctx.beginPath(); ctx.arc(4, 6, s.radius + 1, 0, Math.PI * 2); ctx.fill();

  if (!s.alive) {
    ctx.rotate(s.angle);
    ctx.fillStyle = skin.body;
    ctx.beginPath(); ctx.ellipse(0, 0, 24 * (1 + s.deathAnim * 0.35), 14 * (1 - s.deathAnim * 0.25), 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#750808'; ctx.beginPath(); ctx.arc(4, 2, 12, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    return;
  }

  if (settings.gameMode === 'CASUAL' && s.team === playerTeam && !s.isPlayer) {
    ctx.font = 'bold 11px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#55ff66'; ctx.textAlign = 'center';
    ctx.fillText(s.name, 0, -34);
  }

  ctx.rotate(s.angle);
  const stride = s.moving ? Math.sin(s.walkPhase) * 11 : 0;
  ctx.fillStyle = skin.camo ? skin.trim : '#161719';
  ctx.beginPath();
  ctx.ellipse(stride, -10.5, 8, 4.6, 0, 0, Math.PI * 2);
  ctx.ellipse(-stride, 10.5, 8, 4.6, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = skin.body;
  ctx.beginPath(); ctx.ellipse(-2, 0, 14, 19.5, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#121315'; ctx.lineWidth = 2; ctx.stroke();

  ctx.fillStyle = skin.trim;
  ctx.fillRect(-10, -14, 7, 28);

  const w = s.inventory[s.activeSlot];
  if (w) {
    ctx.save();
    const swingAngle = w.kind === 'melee' ? (s.swingAnim * 1.15 - 0.25) : (s.swingAnim * 0.14);
    ctx.translate(-s.recoilOffset * 28, 0);
    ctx.rotate(swingAngle);

    if (w.kind === 'c4') {
      ctx.fillStyle = '#475242';
      roundRect(ctx, 8, -5, 14, 10, 2); ctx.fill();
      ctx.fillStyle = '#d42222'; ctx.fillRect(16, -2, 3, 4);
    } else {
      drawWeaponSilhouette(ctx, w.key);
      ctx.fillStyle = skin.head;
      ctx.beginPath();
      ctx.arc(10, 7.5, 4, 0, Math.PI * 2);
      ctx.arc(w.kind === 'melee' || w.kind === 'grenade' ? 11 : 19, 4, 4, 0, Math.PI * 2);
      ctx.fill();
    }

    if (s.muzzleFlash > 0 && w.kind === 'gun' && !['usp', 'm4a1s', 'mp5sd'].includes(w.key)) {
      const fx = 8 + w.length + 5, fy = 5.2;
      const mg = ctx.createRadialGradient(fx + 6, fy, 1, fx + 6, fy, 19);
      mg.addColorStop(0, 'rgba(255, 248, 180, 0.96)');
      mg.addColorStop(0.5, 'rgba(255, 180, 50, 0.65)');
      mg.addColorStop(1, 'rgba(255, 120, 10, 0)');
      ctx.fillStyle = mg; ctx.beginPath(); ctx.arc(fx + 6, fy, 19, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  ctx.fillStyle = skin.hood || skin.head;
  ctx.beginPath(); ctx.arc(0, 0, 10.2, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke();

  if (skin.glasses) {
    ctx.fillStyle = '#ffd24c';
    ctx.fillRect(5, -6, 3.5, 4.5); ctx.fillRect(5, 1.5, 3.5, 4.5);
  } else {
    ctx.fillStyle = skin.trim; ctx.fillRect(4, -5.5, 4, 11);
  }
  ctx.restore();
}

// --- BOMB PLANT & DEFUSE PROGRESS BAR UI ---
function drawBombPlantDefuseUI(player) {
  if (settings.gameMode !== 'CASUAL' || !player || !player.alive) return;
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  const hasC4 = bomb.state === 'CARRIED' && bomb.carrierId === player.id;
  const siteHere = getSiteAt(player.x, player.y);

  if (bomb.plantProgress > 0 && hasC4) {
    const pct = Math.min(1, bomb.plantProgress / 3.2);
    const bw = 260, bh = 20, bx = cx - bw / 2, by = cy + 68;
    ctx.save();
    ctx.font = 'bold 14px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#ffb000';
    ctx.textAlign = 'center';
    ctx.fillText(`PLANTING C4 AT SITE ${siteHere || ''} (${Math.round(pct * 100)}%)`, cx, by - 8);
    ctx.fillStyle = 'rgba(15, 16, 14, 0.88)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#e84828';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * pct, bh - 4);
    ctx.strokeStyle = '#ffb000';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.restore();
    return;
  }

  if (bomb.defuseProgress > 0 && bomb.state === 'DEFUSING') {
    const pct = Math.min(1, bomb.defuseProgress);
    const bw = 260, bh = 20, bx = cx - bw / 2, by = cy + 68;
    ctx.save();
    ctx.font = 'bold 14px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#74b3f0';
    ctx.textAlign = 'center';
    ctx.fillText(`DEFUSING C4 (${Math.round(pct * 100)}%)`, cx, by - 8);
    ctx.fillStyle = 'rgba(15, 16, 14, 0.88)';
    ctx.fillRect(bx, by, bw, bh);
    ctx.fillStyle = '#58a6ff';
    ctx.fillRect(bx + 2, by + 2, (bw - 4) * pct, bh - 4);
    ctx.strokeStyle = '#74b3f0';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(bx, by, bw, bh);
    ctx.restore();
    return;
  }

  if (hasC4 && siteHere) {
    ctx.save();
    ctx.font = 'bold 14px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#ff6b4a';
    ctx.textAlign = 'center';
    ctx.fillText(`HOLD [E] OR [LMB] TO PLANT C4 (SITE ${siteHere})`, cx, cy + 78);
    ctx.restore();
  } else if (player.team === 'CT' && (bomb.state === 'PLANTED' || bomb.state === 'DEFUSING') && dist(player, bomb) < 48) {
    ctx.save();
    ctx.font = 'bold 14px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#74b3f0';
    ctx.textAlign = 'center';
    ctx.fillText(`HOLD [E] TO DEFUSE C4`, cx, cy + 78);
    ctx.restore();
  }
}

function drawCS16MainMenu() {
  const w = canvas.width, h = canvas.height;
  const t = performance.now() * 0.001;

  const bg = ctx.createLinearGradient(0, 0, w, h);
  bg.addColorStop(0, '#070b18');
  bg.addColorStop(0.52, '#101d3b');
  bg.addColorStop(1, '#080c16');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, w, h);

  const glow = ctx.createRadialGradient(w * 0.34, h * 0.42, 20, w * 0.45, h * 0.5, w * 0.52);
  glow.addColorStop(0, 'rgba(245, 192, 54, 0.22)');
  glow.addColorStop(0.55, 'rgba(42, 95, 185, 0.14)');
  glow.addColorStop(1, 'rgba(0, 0, 0, 0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, w, h);

  ctx.strokeStyle = 'rgba(245, 195, 65, 0.14)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i < 6; i++) {
    const sy = h * 0.34 + i * 11 + Math.sin(t * 1.4 + i) * 3;
    ctx.beginPath();
    ctx.moveTo(0, sy);
    ctx.lineTo(w, sy);
    ctx.stroke();
  }

  const opX = w * 0.64, opY = h * 0.68;
  ctx.save();
  ctx.translate(opX, opY);
  const scale = Math.min(w, h) / 680;
  ctx.scale(scale, scale);

  ctx.save();
  ctx.translate(155, -135);
  ctx.fillStyle = '#1b2740';
  roundRect(ctx, -65, -30, 140, 240, 28); ctx.fill();
  ctx.fillStyle = '#253554';
  roundRect(ctx, -45, -105, 90, 95, 38); ctx.fill();
  ctx.fillStyle = '#d49e74';
  ctx.fillRect(-18, -68, 36, 18);
  ctx.fillStyle = '#182030';

function drawCS16Radar(player) {
  const rx = 86, ry = 86, rRadius = 72, scale = 0.054;
  ctx.save();
  const rg = ctx.createRadialGradient(rx - 18, ry - 18, 6, rx, ry, rRadius);
  rg.addColorStop(0, '#32b826'); rg.addColorStop(1, '#1b7812');
  ctx.fillStyle = rg; ctx.strokeStyle = '#0c2b08'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.arc(rx, ry, rRadius, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  ctx.beginPath(); ctx.arc(rx, ry, rRadius - 2, 0, Math.PI * 2); ctx.clip();
  const refX = player ? player.x : WORLD_CX, refY = player ? player.y : WORLD_CY;

  ctx.fillStyle = 'rgba(10, 38, 6, 0.45)';
  walls.forEach(w => ctx.fillRect(rx + (w.x - refX) * scale, ry + (w.y - refY) * scale, w.w * scale, w.h * scale));

  entities.forEach(e => {
    if (!e.alive || e.isPlayer) return;
    let dx = (e.x - refX) * scale, dy = (e.y - refY) * scale;
    const d = Math.hypot(dx, dy);
    if (d > rRadius - 7) { dx = (dx / d) * (rRadius - 7); dy = (dy / d) * (rRadius - 7); }
    if (settings.gameMode === 'DEATHMATCH') {
      if (player && hasLineOfSight(player.x, player.y, e.x, e.y) && dist(player, e) < 1050) {
        ctx.fillStyle = '#ff3838'; ctx.beginPath(); ctx.arc(rx + dx, ry + dy, 3.3, 0, Math.PI * 2); ctx.fill();
      }
    } else if (e.team === playerTeam) {
      ctx.fillStyle = '#55ff66'; ctx.beginPath(); ctx.arc(rx + dx, ry + dy, 3.3, 0, Math.PI * 2); ctx.fill();
    } else if (player && hasLineOfSight(player.x, player.y, e.x, e.y) && dist(player, e) < 980) {
      ctx.fillStyle = '#ff3838'; ctx.beginPath(); ctx.arc(rx + dx, ry + dy, 3.3, 0, Math.PI * 2); ctx.fill();
    }
  });

  if (player && player.alive) {
    ctx.fillStyle = '#ffffff'; ctx.beginPath(); ctx.arc(rx, ry, 3.5, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}

function drawCS16HUD(player) {
  const w = canvas.width, h = canvas.height;
  const amber = '#ffb000', lowRed = '#ff2828';

  if (player && player.alive && isInBuyZone(player)) {
    ctx.font = 'bold 12px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = '#62e862'; ctx.textAlign = 'left';
    ctx.fillText('[B] BUY', 24, 186);
  }

  ctx.save();
  ctx.font = 'bold 12px "Courier New", monospace';
  ctx.fillStyle = 'rgba(255, 195, 40, 0.88)'; ctx.textAlign = 'left';
  ctx.fillText(`${fpsDisplay.toFixed(1)} fps  [${settings.gameMode} / ${settings.difficulty}]`, 16, h - 90);
  ctx.restore();

  ctx.font = 'bold 21px "Arial Narrow", "Impact", sans-serif';
  ctx.textAlign = 'center';

  if (settings.gameMode === 'DEATHMATCH') {
    const leader = entities.slice().sort((a, b) => (b.frags || 0) - (a.frags || 0))[0];
    ctx.fillStyle = '#ff6b4a';
    ctx.fillText(`FFA FRAGS: ${playerFrags}`, w / 2 - 125, 34);
    ctx.fillStyle = '#e8d89a';
    ctx.fillText(leader ? `TOP: ${leader.name} (${leader.frags || 0})` : 'FFA', w / 2 + 125, 34);
  } else {
    ctx.fillStyle = '#e8b366';
    ctx.fillText('T ' + tScore, w / 2 - 110, 34);
    ctx.fillStyle = '#74b3f0';
    ctx.fillText('CT ' + ctScore, w / 2 + 110, 34);
  }

  if (settings.gameMode === 'CASUAL' && (bomb.state === 'PLANTED' || bomb.state === 'DEFUSING')) {
    ctx.fillStyle = Math.floor(performance.now() / 220) % 2 === 0 ? '#ff3030' : amber;
    ctx.fillText(`C4 ${bomb.site} (${bomb.fuseTimer.toFixed(1)}s)`, w / 2, 34);
  } else {
    const mins = Math.floor(Math.max(0, phaseTimer) / 60);
    const secs = Math.floor(Math.max(0, phaseTimer) % 60);
    ctx.fillStyle = gameState === 'FREEZE_TIME' ? '#62e862' : amber;
    ctx.fillText(mins + ':' + (secs < 10 ? '0' : '') + secs, w / 2, 34);
  }

  ctx.font = 'bold 13px "Arial Narrow", "Impact", sans-serif';
  ctx.textAlign = 'right';
  killFeed.forEach((k, idx) => {
    ctx.fillStyle = settings.gameMode === 'DEATHMATCH' ? '#f5b85c' : (k.kTeam === 'T' ? '#e8b366' : '#74b3f0');
    ctx.fillText(`${k.killer} [${k.weapon}${k.headshot ? ' HS' : ''}] ${k.victim}`, w - 20, 26 + idx * 22);
  });

  if (!player) return;

  const hpVal = player.alive ? player.hp : 0;
  const armVal = player.alive ? player.armor : 0;
  const baseY = h - 18, centerX = w / 2;

  ctx.fillStyle = hpVal <= 25 ? lowRed : amber;
  ctx.font = 'bold 34px "Arial Narrow", "Impact", sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText('+ ' + hpVal, centerX - 185, baseY);

  ctx.fillStyle = amber;
  ctx.fillText('ARM ' + armVal, centerX + 55, baseY);

  ctx.textAlign = 'right';
  ctx.font = 'bold 18px "Arial Narrow", "Impact", sans-serif';
  ctx.fillStyle = '#62e862';
  ctx.fillText('$' + playerMoney, w - 22, h - 88);

  const activeW = player.inventory[player.activeSlot];
  if (player.alive && activeW) {
    const thumb = gunThumbnails[activeW.key];
    if (thumb) ctx.drawImage(thumb, w - 245, h - 70, 108, 38);

    ctx.font = 'bold 12px "Arial Narrow", "Impact", sans-serif';
    ctx.fillStyle = amber;
    ctx.fillText(`[${player.activeSlot}] ${activeW.name}`, w - 22, h - 54);

    ctx.font = 'bold 30px "Arial Narrow", "Impact", sans-serif';
    if (player.reloading) ctx.fillText('RELOAD', w - 22, h - 20);
    else if (activeW.kind === 'gun') ctx.fillText(`${activeW.ammo} : ${activeW.reserve}`, w - 22, h - 20);
    else ctx.fillText(activeW.kind.toUpperCase(), w - 22, h - 20);
  }
}

function drawCS16RoundBanner() {
  const cx = canvas.width / 2, cy = canvas.height / 2 - 45;
  ctx.fillStyle = 'rgba(18, 20, 18, 0.9)'; ctx.strokeStyle = '#ffb000'; ctx.lineWidth = 2;
  ctx.fillRect(cx - 290, cy - 32, 580, 82); ctx.strokeRect(cx - 290, cy - 32, 580, 82);
  ctx.font = 'bold 25px "Arial Narrow", "Impact", sans-serif'; ctx.fillStyle = '#ffb000'; ctx.textAlign = 'center';
  ctx.fillText(roundWinnerText, cx, cy - 2);
  ctx.font = 'bold 14px "Arial Narrow", sans-serif'; ctx.fillStyle = '#d4d8cf';
  ctx.fillText(roundSubText, cx, cy + 26);
}

function drawCrosshair() {
  const p = getPlayer();
  const dynamicSpread = (settings.dynamicCrosshair && p && p.alive) ? (p.recoilOffset * 90 + (p.moving ? 7 : 0)) : 0;
  const x = mouse.smoothX, y = mouse.smoothY, gap = 5 + dynamicSpread, len = 9;
  ctx.strokeStyle = settings.crosshairColor;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x - gap - len, y); ctx.lineTo(x - gap, y);
  ctx.moveTo(x + gap, y); ctx.lineTo(x + gap + len, y);
  ctx.moveTo(x, y - gap - len); ctx.lineTo(x, y - gap);
  ctx.moveTo(x, y + gap); ctx.lineTo(x, y + gap + len);
  ctx.stroke();
}

function loop(now) {
  update(now);
  render();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
